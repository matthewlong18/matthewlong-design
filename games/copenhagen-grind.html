<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Start-up Adventure Time</title>
<style>
  :root{
    --bg:#f4ede4; --panel:#fffaf3; --ink:#3b2a20; --muted:#8a7565;
    --t1:#eadcc8; --t2:#e2d2ba; --water:#9cc3cf; --rack:#cdbba3;
    --hero:#3a6ea5; --enemy:#b5483b; --heal:#4f8a5b; --line:#d9c9b3;
    --fight:#d9822b; --magic:#8a5cc7; --sky:#d6e8ee; --ground:#dccaa8; --plat:#c4ae88;
    --grass:#c5d6a4; --grass2:#bccf99; --cobble:#e2d6c4; --counter:#9a6a44;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1511; --panel:#261d17; --ink:#f1e6d8; --muted:#a8937f;
      --t1:#3a2d24; --t2:#33271f; --water:#2f5561; --rack:#4a3a2e;
      --hero:#6a9bd1; --enemy:#d86b5c; --heal:#74b383; --line:#45362a;
      --fight:#e89a4a; --magic:#a883e0; --sky:#24333a; --ground:#3a2e22; --plat:#4d3e2e;
      --grass:#34402a; --grass2:#303b27; --cobble:#3a3029; --counter:#5a3b26;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:16px;overflow-x:hidden}
  .cg{width:100%;max-width:600px;--cell:min(68px,calc((100vw - 32px)/8))}
  .cg h1{font-size:20px;margin:0 0 2px;letter-spacing:.3px}
  .cg .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;gap:8px}
  .phase{font-weight:700;padding:3px 10px;border-radius:99px;background:var(--hero);color:#fff}
  .phase.enemy{background:var(--enemy)}
  .wrap{position:relative;width:calc(var(--cell)*8);margin:0 auto;border-radius:10px;overflow:hidden;border:2px solid var(--line)}
  .board{display:grid;grid-template-columns:repeat(8,var(--cell));grid-auto-rows:var(--cell)}
  .tile{position:relative;background:var(--t1);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
  .tile.alt{background:var(--t2)}
  .tile.water{background:var(--water);cursor:default}
  .tile.rack{background:var(--rack);cursor:default;font-size:calc(var(--cell)*.4)}
  .tile.counter{background:var(--counter);cursor:default;box-shadow:inset 0 -6px 0 color-mix(in srgb,#000 22%,transparent)}
  .tile::after{content:"";position:absolute;inset:0;pointer-events:none}
  .tile.move::after{background:color-mix(in srgb,var(--hero) 30%,transparent);box-shadow:inset 0 0 0 1px var(--hero)}
  .tile.danger::after{background:color-mix(in srgb,var(--enemy) 18%,transparent)}
  .tile.range::after{background:color-mix(in srgb,var(--fight) 14%,transparent)}
  .tile.target::after{background:color-mix(in srgb,var(--enemy) 40%,transparent);box-shadow:inset 0 0 0 2px var(--enemy);animation:pulse 1s infinite}
  .tile.healt::after{background:color-mix(in srgb,var(--heal) 40%,transparent);box-shadow:inset 0 0 0 2px var(--heal);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .tile.aoe::after{background:color-mix(in srgb,var(--magic) 38%,transparent);box-shadow:inset 0 0 0 2px var(--magic)}
  .tile.boom::after{z-index:2;background:radial-gradient(circle,#fff 0 16%,var(--magic) 42%,transparent 70%);animation:boom .5s ease-out forwards}
  @keyframes boom{from{opacity:1;transform:scale(.35)}to{opacity:0;transform:scale(1.5)}}
  .unit{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
  .unit::before{content:"";position:absolute;bottom:8%;left:20%;right:20%;height:16%;border-radius:50%;background:color-mix(in srgb,var(--hero) 45%,transparent);border:2px solid var(--hero)}
  .unit.foe::before{background:color-mix(in srgb,var(--enemy) 45%,transparent);border-color:var(--enemy)}
  .spr{position:relative;width:88%;height:88%;margin-bottom:10%;image-rendering:pixelated;image-rendering:crisp-edges;animation:bob 1.2s steps(2) infinite}
  .unit.foe .spr{transform:scaleX(-1)}
  @keyframes bob{50%{translate:0 -2px}}
  .unit.sel .spr{animation-duration:.5s}
  .unit.sel::before{box-shadow:0 0 0 3px var(--panel),0 0 10px var(--hero)}
  .unit.done{filter:grayscale(1);opacity:.55}
  .unit.done .spr{animation:none}
  .unit.hit .spr{animation:shake .3s}
  .zz{position:absolute;top:0;right:8%;font-size:12px;font-weight:800;color:var(--magic);z-index:2}
  @keyframes shake{25%{translate:-4px 0;filter:brightness(2)}75%{translate:4px 0}}
  .hp{position:absolute;left:15%;right:15%;bottom:2px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
  .hp i{display:block;height:100%;background:var(--heal)}
  .foe .hp i{background:var(--enemy)}
  .fx{position:absolute;inset:0;pointer-events:none}
  .float{position:absolute;width:calc(100%/8);text-align:center;font-weight:800;font-size:18px;animation:up .9s forwards;text-shadow:0 1px 0 var(--panel),0 -1px 0 var(--panel),1px 0 0 var(--panel),-1px 0 0 var(--panel)}
  @keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-28px);opacity:0}}

  /* ── battle scene ── */
  .battle{position:absolute;inset:0;z-index:4;background:linear-gradient(var(--sky) 0 52%,var(--ground) 52%);cursor:pointer;overflow:hidden}
  .plat{position:absolute;width:32%;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center}
  .plat::before{content:"";position:absolute;bottom:2%;left:0;right:0;height:22%;border-radius:50%;background:var(--plat)}
  .plat.top{right:5%;top:3%}
  .plat.bot{left:5%;bottom:25%}
  .plat img{position:relative;width:78%;margin-bottom:9%;image-rendering:pixelated;image-rendering:crisp-edges;animation:bob 1s steps(2) infinite}
  .plat img.flip{transform:scaleX(-1)}
  .plat.lunge-up img{animation:lup .35s}
  .plat.lunge-down img{animation:ldown .35s}
  @keyframes lup{50%{translate:30% -22%}}
  @keyframes ldown{50%{translate:-30% 22%}}
  .plat.hurt img{animation:hurt .45s}
  @keyframes hurt{20%,60%{opacity:.2;translate:-5% 0}40%,80%{opacity:1;translate:5% 0}}
  .plat.faint img{animation:faint .5s forwards}
  @keyframes faint{to{translate:0 60%;opacity:0}}
  .burst{position:absolute;inset:10%;border-radius:50%;pointer-events:none;animation:burst .55s forwards}
  @keyframes burst{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}
  .bx{position:absolute;width:48%;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:3px 3px 0 color-mix(in srgb,var(--ink) 25%,transparent)}
  .bx.top{left:4%;top:7%}
  .bx.bot{right:4%;bottom:27%}
  .bx .nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bx .row{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10px;font-weight:800;color:var(--muted)}
  .bar2{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar2 i{display:block;height:100%;transition:width .5s}
  .bar2.hpb i{background:var(--heal)}
  .bar2.hpb.low i{background:var(--enemy)}
  .bar2.mpb i{background:var(--magic)}
  .bx .num{text-align:right;font-size:11px;margin-top:2px;color:var(--muted)}
  .msg{position:absolute;left:3%;right:3%;bottom:3%;height:20%;background:var(--panel);border:3px double var(--ink);border-radius:8px;padding:6px 12px;font-weight:700;font-size:clamp(12px,3.3vw,15px);display:flex;align-items:center;line-height:1.3}
  .fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  .battle.quake{animation:quake .35s}
  @keyframes quake{20%{translate:-6px 3px}40%{translate:5px -4px}60%{translate:-4px 2px}80%{translate:3px -1px}}
  .msg,.bx{z-index:3}
  .skip{z-index:4;position:absolute;right:5%;bottom:5%;font-size:10px;color:var(--muted);font-weight:600}
  @media (max-width:420px){
    .bx{width:42%;padding:3px 6px;border-width:1px;font-size:10px}
    .bx .nm{font-size:11px}
    .bx .row{margin-top:2px;font-size:9px}
    .bar2{height:5px}
    .bx .num{display:none}
    .bx.top{top:4%}
    .bx.bot{bottom:24%}
  }

  /* ── panel & menu ── */
  .panel{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
  .info{min-height:66px}
  .info b{font-size:15px}
  .stats{color:var(--muted);font-size:12px;margin-top:2px}
  /* fixed-ish heights so the panel (and the iframe around it) doesn't jump as the menu changes */
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;min-height:152px;align-content:start}
  .menu .hint{grid-column:1/-1;font-size:12px;color:var(--muted)}
  .menu .aux{padding:6px 12px;font-size:12px}
  @media (max-width:420px){
    .menu{gap:6px;min-height:140px}
    button.mv{padding:6px 8px;border-left-width:4px}
    button.mv b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    button.mv small{font-size:10px;line-height:1.3}
  }
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
  button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  button.cmd{font-size:15px;font-weight:800;padding:12px 14px;border:2px solid var(--ink)}
  button.cmd.fight{border-left:8px solid var(--fight)}
  button.cmd.magic{border-left:8px solid var(--magic)}
  button.mv{border-left:6px solid var(--fight);padding:8px 10px}
  button.mv.magic{border-left-color:var(--magic)}
  button.mv b{display:block;font-size:14px}
  button.mv small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
  button:disabled{opacity:.4;cursor:default}
  .log{margin-top:10px;font-size:12px;color:var(--muted);height:66px;overflow:auto;line-height:1.5}
  .snd{padding:3px 8px;font-size:14px;line-height:1}
  .toggle{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
  .overlay{position:absolute;inset:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:8px}
  .overlay h2{margin:0;font-size:22px}
  .overlay p{margin:0;font-size:13px;color:var(--muted);max-width:380px;line-height:1.5}
  .overlay a{color:var(--ink);font-weight:700}
  .overlay button{text-align:center}
  .overlay .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .hidden{display:none!important}

  /* ── screens: title → create → town → battle ── */
  #cg[data-screen="title"] > :not(.title){display:none}
  #cg:not([data-screen="title"]) .title{display:none}
  .title{position:relative;overflow:hidden;border-radius:12px;border:2px solid var(--line);padding:34px 16px 22px;text-align:center;
    background:linear-gradient(var(--sky) 0 58%,var(--ground) 58%)}
  .logo{display:flex;flex-direction:column;align-items:center;line-height:.92;font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--fight);
    text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
  .logo span:first-child{font-size:clamp(22px,6vw,34px)}
  .logo span:last-child{font-size:clamp(28px,7.8vw,48px);color:var(--panel)}
  .tag{margin:12px 0 0;font-size:13px;font-weight:700;color:var(--ink)}
  .lineup{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:18px 0 6px}
  .lineup img{width:clamp(40px,11vw,60px);image-rendering:pixelated;image-rendering:crisp-edges;animation:bob 1.2s steps(2) infinite}
  .lineup img:nth-child(even){animation-delay:.6s}
  .lineup img.flip{transform:scaleX(-1)}
  .lineup .vs{font:900 14px ui-monospace,Menlo,Consolas,monospace;color:var(--ink);margin:0 6px 14px}
  .start{margin-top:14px;padding:12px 26px;font-size:16px;letter-spacing:.06em;text-align:center;animation:blink 1.1s steps(2) infinite}
  .start:hover,.start:focus-visible{animation:none}
  @keyframes blink{50%{opacity:.55}}
  .tiny{margin:12px 0 0;font-size:11px;color:var(--muted)}
  #cg[data-screen="create"] .bar, #cg[data-screen="create"] .wrap, #cg[data-screen="create"] .panel{display:none}
  #cg:not([data-screen="create"]) .creator{display:none}
  #cg:not([data-screen="town"]) .town{display:none}
  #cg[data-screen="town"] #turn, #cg[data-screen="town"] #phase, #cg[data-screen="town"] .toggle{visibility:hidden}
  #cg[data-screen="town"] .menu, #cg[data-screen="town"] .btns, #cg[data-screen="town"] .log{display:none}

  /* ── character creator ── */
  .creator{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .cr-top{display:flex;gap:14px;align-items:center}
  #crPrev{width:112px;height:112px;flex:none;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--t1);border:2px solid var(--line);border-radius:10px}
  .cr-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .cr-name label, .cr-row h3{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0}
  .cr-name input{font:inherit;font-size:16px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .cr-name button{align-self:flex-start}
  .cr-row{margin-top:12px}
  .cr-row h3{margin-bottom:6px}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--line)}
  .sw.on{outline:3px solid var(--ink);outline-offset:1px}
  .chip{padding:6px 11px;font-size:12px;border-radius:99px;text-align:center}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .cr-go{margin-top:16px;width:100%;padding:12px;font-size:15px;text-align:center}

  /* ── town (Canggu): a pixel-art canvas with a scrolling camera ── */
  #cg[data-screen="town"] .wrap{height:calc(var(--cell)*8)}   /* square view while exploring */
  .town{position:absolute;inset:0;z-index:3;overflow:hidden;background:#78b350}
  #townCv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
  /* cutscenes */
  .fade{position:absolute;inset:0;z-index:9;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
  .fade.on{opacity:1;pointer-events:auto}
  .cutbox{position:absolute;left:6px;right:6px;bottom:6px;z-index:6;display:flex;gap:10px;align-items:flex-start;padding:8px 26px 8px 8px;border:3px double #3b2a20;border-radius:8px;background:#fffaf3;color:#3b2a20;font-size:13px;line-height:1.4;cursor:pointer;user-select:none}
  .cutbox img{width:40px;height:40px;flex:none;image-rendering:pixelated;image-rendering:crisp-edges;background:#eadcc8;border-radius:6px}
  .cutbox b{display:block;font-size:12px;color:#a8391a}
  .cutbox .more{position:absolute;right:8px;bottom:5px;font-size:11px;animation:blink 1s steps(2) infinite}
  .banner{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none;font:900 clamp(40px,12vw,72px)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--fight);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);animation:bannerPop 1s ease-out forwards}
  @keyframes bannerPop{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
  .tlabels{position:absolute;inset:0;pointer-events:none}
  .tlbl{position:absolute;translate:-50% -100%;font-size:10px;font-weight:800;line-height:1.4;padding:0 6px;border-radius:5px;white-space:nowrap;background:rgba(255,250,243,.92);color:#3b2a20;box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .tlbl.main{background:#e0782b;color:#fff}
  .hud{position:absolute;right:6px;top:6px;z-index:1;display:flex;gap:4px;pointer-events:none}
  .hud span{font-size:12px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(30,22,18,.72);color:#fff}
  .hud span.zero{opacity:.45}
  .talk{position:absolute;left:6px;right:6px;bottom:6px;z-index:4;padding:8px 26px 8px 10px;border:3px double #3b2a20;border-radius:8px;background:#fffaf3;color:#3b2a20;font-size:13px;line-height:1.4;cursor:pointer;user-select:none}
  .talk b{display:block;margin-bottom:2px;font-size:12px;color:#a8391a}
  .talk .more{position:absolute;right:8px;bottom:5px;font-size:11px;animation:blink 1s steps(2) infinite}
  button.mv.item{border-left-color:var(--heal)}
</style>
</head>
<body>
<div class="cg" id="cg" data-screen="title">
  <section class="title" id="title" aria-label="Super Start-up Adventure Time">
    <div class="logo"><span>Super Start-up</span><span>Adventure Time</span></div>
    <p class="tag">Digital nomads vs. the suits · Canggu, Bali</p>
    <div class="lineup" id="lineup" aria-hidden="true"></div>
    <button class="primary start" id="tStart">▶ Press start</button>
    <p class="tiny">A tiny tactics adventure · about 5 minutes · sound on 🔊</p>
  </section>
  <h1>🌴 Super Start-up Adventure Time</h1>
  <p class="sub">A beautiful morning in Canggu, Bali.</p>
  <section class="creator" id="creator" aria-label="Make your hero">
    <div class="cr-top">
      <canvas id="crPrev" width="24" height="24" role="img" aria-label="Your hero"></canvas>
      <div class="cr-name">
        <label for="crName">Your name</label>
        <input id="crName" maxlength="14" placeholder="Your name" autocomplete="off" spellcheck="false">
        <button id="crRand">🎲 Randomise</button>
      </div>
    </div>
    <div id="crRows"></div>
    <button class="primary cr-go" id="crGo">Head to Canggu →</button>
  </section>
  <div class="bar">
    <span id="turn">Turn 1</span>
    <span style="display:flex;gap:10px;align-items:center"><label class="toggle"><input type="checkbox" id="scenes" checked> Battle scenes</label><button class="snd" id="snd" title="Sound on/off">🔊</button></span>
    <span class="phase" id="phase">Your turn</span>
  </div>
  <div class="wrap">
    <div class="board" id="board"></div>
    <div class="town" id="town"><canvas id="townCv" aria-label="Canggu town map"></canvas><div class="tlabels" id="tlabels"></div><div class="hud" id="hud"></div><div class="talk hidden" id="talk" role="status"></div></div>
    <div class="fx" id="fx"></div>
    <div class="battle hidden" id="battle">
      <div class="plat top" id="pTop"><img alt=""></div>
      <div class="plat bot" id="pBot"><img alt=""></div>
      <div class="bx top" id="bTop"></div>
      <div class="bx bot" id="bBot"></div>
      <canvas class="fxc" id="fxc"></canvas>
      <div class="msg" id="msg"></div>
      <div class="skip">tap to skip ›</div>
    </div>
    <div class="overlay hidden" id="overlay"></div>
    <div class="cutbox hidden" id="cut" role="status"></div>
    <div class="banner hidden" id="banner" aria-hidden="true"></div>
    <div class="fade" id="fade"></div>
  </div>
  <div class="panel">
    <div class="info" id="info">Pick a hero to begin.</div>
    <div class="menu" id="menu"></div>
    <div class="btns">
      <button id="end" class="primary">End turn</button>
      <button id="restart">Restart</button>
    </div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
(() => {
  const COLS = 8, ROWS = 6;
  const MAP = [            // inside The Sloppy Sloth: "~" = bamboo bar counter, "#" = potted palm
    "....~~..",
    "........",
    "..#.....",
    ".....#..",
    "........",
    "...~~...",
  ];

  // ── MOVES ──  kind: fight (uses armour) | magic (costs MP, ignores armour)
  //             type: dmg | heal | stun (stun = % chance the target skips its next turn) | summon
  //             area: 1 = also hits the 4 squares around the target square (a "+" shape)
  // Your hero: built from the character creator (name + look), stats below.
  const heroDef = () => ({name:P.name || "You", spr:"player", team:"hero", hp:40, mp:12, def:4, mov:3,
    blurb:"Regular at The Sloppy Sloth. Not leaving.",
    moves:[
      {name:"Haymaker",     kind:"fight", type:"dmg",  pow:12, rng:[1,1]},
      {name:"Pint Toss",    kind:"fight", type:"dmg",  pow:8,  rng:[2,3]},
      {name:"Mosh Pit",     kind:"magic", type:"dmg",  pow:10, rng:[1,3], mp:5, color:"#c96f8a", area:1},

        el.className="unit"+(u.team==="foe"?" foe":"")+(u===S.sel?" sel":"")+(u.acted?" done":"")+(S.hit.has(u.id)?" hit":"");
        el.innerHTML=`<img class="spr" src="${SPRITE_URL[u.spr]}" alt="${u.name}"><span class="hp"><i style="width:${u.hp/u.maxHp*100}%"></i></span>${u.stun?'<span class="zz">z</span>':""}`;
        c.appendChild(el);
      }
      c.onclick=()=>onCell(x,y);
      board.appendChild(c);
    }
    $("turn").textContent="Turn "+S.turn;
    const ph=$("phase"); ph.textContent=S.phase==="enemy"?"Enemy turn":"Your turn"; ph.classList.toggle("enemy",S.phase==="enemy");
    $("end").disabled = S.phase!=="player" || S.busy;
  }
  let fitFrame = () => {};   // set at the bottom when the game is inside an iframe
  function render(){ renderBoard(); renderMenu(); fitFrame(); }

  function btn(html, cls, onclick, disabled){
    const b=document.createElement("button"); b.className=cls; b.innerHTML=html; b.disabled=!!disabled; b.onclick=e=>{ Sound.sfx(/Back|Undo/.test(html)?"back":"blip"); onclick(e); }; menu.appendChild(b); return b;
  }

  function renderMenu(){
    menu.innerHTML="";
    const u=S.sel; if(!u || S.busy || S.phase!=="player") return;
    if(S.mode==="menu"){
      // one list: fight moves (orange) and magic moves (purple) together
      let any=false;
      for(const m of u.moves){
        const tg=targetsFor(u,m), ok=canUse(u,m)&&tg.length; if(ok) any=true;
        const eff = (m.type==="heal" ? `HEAL ${m.pow}` : m.type==="stun" ? `STUN ${m.stun}%` : m.type==="summon" ? "ONCE" : `PWR ${m.pow}${m.stun?` · STUN ${m.stun}%`:""}`) + (m.area ? " · AREA" : "");
        const why = !canUse(u,m) ? " · low MP" : !tg.length ? (m.type==="summon" && S.claudeIn ? " · already here" : " · out of range") : "";
        const b=btn(`<b>${m.type==="summon"?"🍁":m.area?"💥":m.kind==="magic"?"✨":"⚔️"} ${m.name}</b><small>${eff} · RNG ${rngTxt(m.rng)}${m.mp?` · ${m.mp} MP`:""}${why}</small>`,
          "mv "+m.kind, ()=>pickMove(m), !ok);
        b.onmouseenter=()=>{ S.range=rangeTiles(u,m); renderBoard(); };
        b.onmouseleave=()=>{ S.range=new Set(); renderBoard(); };
      }
      for(const [k,it] of Object.entries(ITEMS)) if(S.inv[k]>0)
        btn(`<b>${it.icon} ${it.name} ×${S.inv[k]}</b><small>ITEM · ${it.desc}</small>`, "mv item", ()=>useItem(u,k));
      btn("Wait","aux", ()=>{ log(`${u.name} holds position.`); finish(u); });
      btn("↩ Undo move","aux", ()=>{ [u.x,u.y]=S.origin; select(u); });
      if(!any){ const h=document.createElement("div"); h.className="hint"; h.textContent="Nothing in range from here. Wait, or undo and move closer."; menu.appendChild(h); }
    } else if(S.mode==="target"){
      const h=document.createElement("div"); h.className="hint";
      h.textContent = S.move.area ? `${S.move.name}: tap a square to aim (the purple + is the blast), tap it again to cast.` : `${S.move.name}: tap a highlighted target.`;
      menu.appendChild(h);
      btn("← Back","aux",()=>{S.mode="menu";S.targets=new Map();S.range=new Set();S.blast=new Set();S.aoeAt=null;render();});
    }
  }

  function rangeTiles(u,m){
    const s=new Set();
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(inR(Math.abs(x-u.x)+Math.abs(y-u.y),m.rng)) s.add(K(x,y));
    return s;
  }

  function clearSel(){ S.sel=null; S.mode=null; S.move=null; S.moveSet=new Map(); S.targets=new Map(); S.danger=new Set(); S.range=new Set(); S.blast=new Set(); S.aoeAt=null; }

  function select(u){ Sound.sfx("select"); clearSel(); S.sel=u; S.mode="move"; S.moveSet=reachable(u); showInfo(u); render(); }

  function pickMove(m){
    S.move=m; S.mode="target"; S.range=rangeTiles(S.sel,m); S.targets=new Map(); S.blast=new Set(); S.aoeAt=null;
    for(const t of targetsFor(S.sel,m)) S.targets.set(K(t.x,t.y), m.area?"area" : m.type==="heal"||m.type==="summon"?"heal":"atk");
    render();
  }

  function onCell(x,y){
    if(S.phase!=="player"||S.busy) return;
    const u=unitAt(x,y), k=K(x,y);
    if(S.mode==="target"){
      if(!S.targets.has(k)) return;
      if(S.move.area && S.aoeAt!==k){ S.aoeAt=k; S.blast=areaTiles(x,y,S.move.area); Sound.sfx("blip"); render(); return; }   // first tap: aim
      doMove(S.sel,u,S.move,x,y); return;
    }
    if(S.mode==="menu"||S.mode==="moves") return;
    if(S.mode==="move" && S.moveSet.has(k) && (!u||u===S.sel)){
      S.origin=[S.sel.x,S.sel.y]; S.sel.x=x; S.sel.y=y; S.mode="menu"; S.moveSet=new Map(); showInfo(S.sel); render(); return;
    }
    if(u && u.team==="hero" && !u.acted){ select(u); return; }
    if(u){ clearSel(); if(u.team==="foe") S.danger=new Set(reachable(u).keys()); showInfo(u); render(); return; }
    clearSel(); render();
  }

  // ── combat resolution ──
  function resolve(a,t,m){
    const r={};
    a.mp -= (m.mp||0);
    if(m.type==="heal"){ r.heal=Math.min(m.pow, t.maxHp-t.hp); t.hp+=r.heal; return r; }
    if(m.pow){
      let dmg = m.kind==="magic" ? m.pow + Math.floor(Math.random()*3) - 1 : Math.max(1, m.pow + (a.boost||0) - t.def + Math.floor(Math.random()*3));
      if(m.kind==="fight" && Math.random()<0.1){ r.crit=true; dmg=Math.round(dmg*1.5); }
      r.dmg=dmg; t.hp=Math.max(0,t.hp-dmg);
    }
    if(t.hp===0){ t.alive=false; r.ko=true; }
    else if(m.stun){ r.stunned = Math.random()*100 < m.stun; if(r.stunned) t.stun=true; else r.resisted=true; }
    return r;
  }

  // ── MUSIC & SOUND ── original chiptunes, synthesised live (no audio files).
  // Songs: one token per 8th note. "D5" = note, "-" = hold previous, "." = rest.
  // Drums: k = kick, s = snare, h = hi-hat, . = nothing.
  const SONGS = {
    battle: { bpm:160, loop:true,
      lead:`A4 C5 E5 A5 G5 E5 C5 E5  F5 - E5 D5 E5 - C5 -  A4 C5 E5 A5 B5 A5 G5 E5  G#5 - - E5 B4 - E5 -

      bass:`A2 A2 A3 A2 A2 A2 A3 A2  F2 F2 F3 F2 F2 F2 F3 F2  A2 A2 A3 A2 A2 A2 A3 A2  E2 E2 E3 E2 E2 E2 E3 E2
            F2 F2 F3 F2 F2 F2 F3 F2  C3 C3 C4 C3 C3 C3 C4 C3  D3 D3 D4 D3 E2 E2 E3 E2  A2 A2 A3 A2 A2 A2 A3 A2`,
      drums:"k.s.kks.".repeat(7)+"k.s.s.ss", hats:true },
    morning: { bpm:88, loop:true, wave:"triangle", leadVol:0.12,   // the wake-up scene: soft, bell-like, pentatonic
      lead:`D5 - A5 - G5 - E5 -  D5 - E5 G5 A5 - - -  C6 - A5 - G5 - E5 -  G5 - - - . . . .
            D5 - A5 - G5 - E5 -  D5 - E5 G5 A5 - C6 -  D6 - C6 A5 G5 - E5 -  D5 - - - . . . .`,
      bass:`D3 . . . A2 . . .  G2 . . . D3 . . .  C3 . . . G2 . . .  A2 . . . D3 . . .
            D3 . . . A2 . . .  G2 . . . D3 . . .  C3 . . . G2 . . .  A2 . . . D3 . . .`,
      drums:"", hats:false },
    cafe: { bpm:112, loop:true,
      lead:`D5 - F#5 A5 B5 A5 F#5 D5  E5 - F#5 G5 F#5 E5 D5 -  B4 - D5 F#5 G5 F#5 E5 D5  C#5 D5 E5 - A4 - . .
            D5 - F#5 A5 D6 - C#6 B5  A5 - G5 F#5 G5 A5 B5 -  G5 F#5 E5 D5 E5 F#5 E5 C#5  D5 - - - . . A4 .`,
      bass:`D3 . A2 . D3 . A2 .  A2 . E3 . A2 . E3 .  B2 . F#2 . B2 . F#2 .  A2 . E2 . A2 . C#3 .
            D3 . A2 . D3 . A2 .  G2 . D3 . G2 . D3 .  E2 . B2 . A2 . C#3 .  D3 . A2 . D3 . . .`,

      lead:`G4 C5 E5 G5 - E5 G5 -  C6 - - - B5 C6 D6 -  E6 - - - - - . .`,
      bass:`C3 . G2 . C3 . G2 .  F2 . F2 . G2 . G2 .  C3 - - - - - . .`,

  const Sound = (() => {
    let ctx=null, master, music, fx, noiseBuf, song=null, events=null, step=0, nextT=0, timer=null;
    let on = true; try { on = localStorage.getItem("cg-sound") !== "off"; } catch(e){}
    const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
    const freq = n => { const m=n.match(/^([A-G])(#|b)?(\d)$/); if(!m) return 0;
      const midi=12*(+m[3]+1)+NOTE[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0); return 440*Math.pow(2,(midi-69)/12); };
    function parse(str){ const toks=str.trim().split(/\s+/), out=toks.map(()=>null);
      toks.forEach((tk,i)=>{ if(tk==="-"||tk===".") return; let len=1; while(toks[i+len]==="-") len++; out[i]={f:freq(tk),len}; }); return out; }
    function init(){
      if(ctx) { if(ctx.state==="suspended") ctx.resume(); return; }
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=on?0.5:0; master.connect(ctx.destination);
      music=ctx.createGain(); music.gain.value=0.45; music.connect(master);
      fx=ctx.createGain(); fx.gain.value=0.8; fx.connect(master);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    function tone(type,f,t,dur,vol,dest,slideTo){
      if(!ctx||!f) return; const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(f,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008);
      g.gain.setValueAtTime(vol,t+Math.max(0.01,dur*0.7)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.02);
    }
    function noise(t,dur,vol,dest,type="highpass",f=1000,fTo){
      if(!ctx) return; const s=ctx.createBufferSource(), b=ctx.createBiquadFilter(), g=ctx.createGain();
      s.buffer=noiseBuf; b.type=type; b.frequency.setValueAtTime(f,t); if(fTo) b.frequency.exponentialRampToValueAtTime(fTo,t+dur);
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      s.connect(b); b.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+0.02);
    }
    function tick(){
      if(!song) return; const sd=60/song.bpm/2;
      while(nextT < ctx.currentTime+0.15){
        const L=events.lead[step], B=events.bass[step], D=song.drums[step % (song.drums.length||1)];
        if(L) { const lw=song.wave||"square", lv=song.leadVol||0.07; tone(lw,L.f,nextT,L.len*sd*0.92,lv,music); tone(lw,L.f*1.004,nextT+0.012,L.len*sd*0.8,lv*.35,music); }
        if(B) tone("triangle",B.f,nextT,B.len*sd*0.85,0.22,music);
        if(D==="k") tone("sine",150,nextT,0.13,0.5,music,40);
        if(D==="s") noise(nextT,0.09,0.18,music,"highpass",1800);
        if(song.hats && step%2===1) noise(nextT,0.03,0.05,music,"highpass",7000);
        nextT+=sd; step++;
        if(step>=events.len){
          if(song.loop) step=0;
          else { const nx=song.next; song=null; clearInterval(timer); timer=null;
                 if(nx) setTimeout(()=>play(nx), Math.max(0,(nextT-ctx.currentTime)*1000)+200); return; }
        }
      }
    }
    function play(name){
      init(); if(!ctx) return; stop(); song=SONGS[name]; if(!song) return;
      events={lead:parse(song.lead), bass:parse(song.bass)}; events.len=Math.max(events.lead.length,events.bass.length);
      step=0; nextT=ctx.currentTime+0.06; timer=setInterval(tick,25); tick();
    }
    function stop(){ song=null; if(timer) clearInterval(timer); timer=null; }

    // sound effects — keyed by the same names as the visual effects
    const SFX = {
      blip:  t=>tone("square",880,t,0.05,0.08,fx),
      select:t=>{ tone("square",660,t,0.05,0.08,fx); tone("square",990,t+0.05,0.06,0.08,fx); },
      back:  t=>tone("square",440,t,0.06,0.07,fx,330),
      hit:   t=>{ noise(t,0.12,0.5,fx,"lowpass",2500,300); tone("square",180,t,0.1,0.15,fx,60); },
      ko:    t=>{ [523,392,294,196].forEach((f,i)=>tone("square",f,t+i*0.09,0.1,0.12,fx)); },
      slash: t=>[0,0.1,0.2].forEach(d=>noise(t+d,0.12,0.4,fx,"bandpass",800,5000)),
      bash:  t=>{ tone("sine",120,t,0.25,0.7,fx,35); noise(t,0.2,0.5,fx,"lowpass",1200,200); },
      whack: t=>{ tone("square",300,t,0.08,0.2,fx,900); tone("triangle",1200,t+0.08,0.15,0.2,fx,600); },
      arrow: t=>{ noise(t,0.35,0.25,fx,"bandpass",600,4000); noise(t+0.43,0.08,0.4,fx,"lowpass",1500); tone("square",220,t+0.43,0.06,0.12,fx,90); },
      bigArrow:t=>{ [0,0.05,0.1,0.15].forEach((d,i)=>tone("square",440*Math.pow(1.26,i),t+d,0.08,0.08,fx)); noise(t+0.18,0.45,0.3,fx,"bandpass",800,6000); noise(t+0.63,0.25,0.45,fx,"lowpass",3000,200); },
      vinyl: t=>{ tone("sawtooth",300,t,0.5,0.06,fx,900); tone("square",784,t+0.6,0.08,0.1,fx); tone("square",1047,t+0.68,0.12,0.1,fx); },
      lightning:t=>{ noise(t+0.15,0.5,0.6,fx,"highpass",400,3000); for(let i=0;i<8;i++) tone("square",200+Math.random()*1400,t+0.15+i*0.035,0.03,0.1,fx); tone("sine",90,t+0.2,0.4,0.5,fx,30); },
      mead:  t=>{ [523,659,784,1047,1319].forEach((f,i)=>tone("triangle",f,t+i*0.07,0.3,0.12,fx)); },
      heal:  t=>{ [784,988,1175,1568].forEach((f,i)=>tone("triangle",f,t+i*0.08,0.25,0.14,fx)); },
      pourover:t=>{ for(let i=0;i<6;i++) tone("sine",900+i*80,t+i*0.06,0.05,0.12,fx,500); [784,988,1175,1568].forEach((f,i)=>tone("triangle",f,t+0.5+i*0.08,0.25,0.14,fx)); },
      fog:   t=>{ noise(t,0.9,0.18,fx,"lowpass",400,1200); tone("sine",330,t,0.9,0.05,fx,300); },
      email: t=>{ for(let i=0;i<7;i++) tone("square",1200+(i%2)*300,t+i*0.07,0.04,0.06,fx); },
      micro: t=>{ for(let i=0;i<6;i++) tone("square",i%2?523:494,t+i*0.12,0.1,0.07,fx); },
      coins: t=>{ for(let i=0;i<6;i++){ const s=t+0.1+i*0.09; tone("square",1760,s,0.05,0.06,fx); tone("square",2637,s+0.05,0.12,0.06,fx); } },
      takeover:t=>{ tone("sawtooth",110,t,1.0,0.12,fx,55); tone("sawtooth",116,t,1.0,0.1,fx,58); noise(t+0.85,0.3,0.5,fx,"lowpass",800,100); },
      slides:t=>{ [0,0.12,0.24].forEach(d=>noise(t+d,0.18,0.25,fx,"bandpass",1500,3000)); noise(t+0.5,0.1,0.3,fx,"lowpass",1200); },
      beam:  t=>{ tone("sine",200,t,0.3,0.15,fx,1200); tone("sawtooth",880,t+0.3,0.6,0.07,fx,660); tone("square",886,t+0.3,0.6,0.05,fx,664); },
      stun:  t=>{ for(let i=0;i<5;i++) tone("sine",i%2?1200:900,t+i*0.06,0.06,0.08,fx); },
      arrive:t=>{ [392,523,659,784].forEach((f,i)=>tone("square",f,t+i*0.1,0.12,0.1,fx)); tone("square",1047,t+0.4,0.5,0.12,fx); tone("triangle",523,t+0.4,0.5,0.2,fx); },
      pint:  t=>{ noise(t,0.3,0.15,fx,"bandpass",800,2000); tone("triangle",2093,t+0.5,0.15,0.12,fx); tone("triangle",2637,t+0.56,0.2,0.1,fx); },
      puck:  t=>{ noise(t,0.05,0.5,fx,"highpass",2000); tone("square",120,t,0.08,0.3,fx,60); noise(t+0.42,0.1,0.4,fx,"lowpass",1500); },
      step:  t=>tone("triangle",180,t,0.04,0.05,fx,140),
      rooster:t=>{ const v=0.075; tone("sawtooth",520,t,0.12,v,fx,760); tone("sawtooth",760,t+0.15,0.14,v,fx,1000); tone("sawtooth",1000,t+0.32,0.12,v,fx,900);
        tone("sawtooth",900,t+0.47,0.3,v,fx,1200); tone("sawtooth",1200,t+0.77,0.4,v,fx,820); noise(t,1.2,0.025,fx,"bandpass",1400,2200); },   // cock-a-doodle-doo
      boom:  t=>{ tone("sine",170,t,0.5,0.6,fx,40); noise(t,0.45,0.5,fx,"lowpass",2600,180); [523,659,784].forEach((f,i)=>tone("square",f,t+0.05+i*0.05,0.08,0.06,fx)); },
    };
    function sfx(name){ if(!ctx||!on) return; const f=SFX[name]; if(f) f(ctx.currentTime+0.01); }
    function setOn(v){ on=v; try{ localStorage.setItem("cg-sound", v?"on":"off"); }catch(e){}
      if(ctx) master.gain.setTargetAtTime(v?0.5:0, ctx.currentTime, 0.05); }
    return { init, play, stop, sfx, setOn, get on(){ return on; } };
  })();

  // ── ATTACK EFFECTS ── each move name → an effect below. Swap them around freely.
  const MOVE_FX = {
    "Haymaker":"bash", "Pint Toss":"pint", "Second Wind":"heal",
    "Slapshot":"puck", "Timber!":"slash", "Poutine Break":"heal",
    "Reply-All":"email", "Coffee Run":"whack", "Cc Everyone":"email", "Micromanage":"micro", "Golden Parachute":"coins", "Hostile Takeover":"takeover",
    "Slide Deck Toss":"slides", "Synergy Beam":"beam",
    "Ship It":"bash", "Automate It":"lightning", "Clear Brief":"heal",
  };
  const lerp=(a,b,t)=>a+(b-a)*t, clamp=t=>Math.max(0,Math.min(1,t)), rnd=(a,b)=>a+Math.random()*(b-a);
  const easeOut=t=>{ t=clamp(t); return 1-(1-t)*(1-t); };
  function star(ctx,x,y,r,rot,color){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.fillStyle=color; ctx.beginPath();
    for(let i=0;i<10;i++){ const rr=i%2?r*.45:r, a=i*Math.PI/5-Math.PI/2; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); } ctx.closePath(); ctx.fill(); ctx.restore(); }
  function sparks(ctx,T,u,n,len,color,seed=0){ ctx.strokeStyle=color; ctx.lineCap="round";
    for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+seed, r0=len*u, r1=len*(0.3+u); ctx.globalAlpha=1-u; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(T.x+Math.cos(a)*r0,T.y+Math.sin(a)*r0); ctx.lineTo(T.x+Math.cos(a)*r1,T.y+Math.sin(a)*r1); ctx.stroke(); } ctx.globalAlpha=1; }
  function ring(ctx,T,r,w,color,alpha){ ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=w; ctx.beginPath(); ctx.arc(T.x,T.y,Math.max(0,r),0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; }
  function flash(ctx,W,H,alpha,color="#fff"){ ctx.globalAlpha=alpha; ctx.fillStyle=color; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  function arrowAt(ctx,x,y,ang,len,big){ ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
    if(big){ ctx.shadowColor="#6fb6ff"; ctx.shadowBlur=GLOW?18:0; }
    ctx.strokeStyle=big?"#bfe0ff":"#8a5a32"; ctx.lineWidth=big?6:4; ctx.beginPath(); ctx.moveTo(-len,0); ctx.lineTo(0,0); ctx.stroke();
    ctx.fillStyle=big?"#ffffff":"#dfe6ec"; ctx.beginPath(); ctx.moveTo(len*.28,0); ctx.lineTo(-len*.05,-len*.13); ctx.lineTo(-len*.05,len*.13); ctx.fill();

  function playFx(name, fromEl, toEl){
    return new Promise(res=>{
      const make=FX[name]; if(!make) return res();
      Sound.sfx(name);
      const bt=$("battle"), cv=$("fxc"), br=bt.getBoundingClientRect(), dpr=Math.min(2, window.devicePixelRatio||1);   // 3x canvases are costly on phones
      const W=br.width, H=br.height; cv.width=W*dpr; cv.height=H*dpr;
      const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
      const ctr=el=>{ const r=el.getBoundingClientRect(); return {x:r.left-br.left+r.width/2, y:r.top-br.top+r.height*.55}; };
      const A=ctr(fromEl), T=ctr(toEl), fx=make(A,T,W,H);
      if(fx.shake){ bt.classList.remove("quake"); void bt.offsetWidth; setTimeout(()=>bt.classList.add("quake"), fx.dur*.5/(speed()*FX_RATE)); }
      let t=0, last=performance.now();
      (function frame(now){
        t = Math.max(0, t + Math.max(0, now-last)/fx.dur*speed()*FX_RATE); last=Math.max(last,now);
        ctx.clearRect(0,0,W,H);
        if(t>=1){ return res(); }
        try { ctx.save(); fx.draw(ctx,t); }
        catch(err){ console.warn("fx skipped:", name, err); ctx.restore(); ctx.clearRect(0,0,W,H); return res(); }
        ctx.restore();
        requestAnimationFrame(frame);
      })(last);
    });
  }

  function boxHTML(u, hp){
    const pct=hp/u.maxHp*100;
    return `<div class="nm">${u.name}</div>
      <div class="row">HP<div class="bar2 hpb${pct<30?" low":""}"><i style="width:${pct}%"></i></div></div>
      <div class="row">MP<div class="bar2 mpb"><i style="width:${u.mp/u.maxMp*100}%"></i></div></div>
      <div class="num">${hp}/${u.maxHp}</div>`;
  }

  async function typeMsg(text, ms=850){ $("msg").textContent=text; await wait(ms); }

  async function battleScene(a,t,m){
    // hero side bottom-left, the other unit top-right (self-heals show only the caster)
    const self = a===t;
    const heroBottom = a.team==="hero" ? a : t;
    const other = self ? null : (heroBottom===a ? t : a);
    const pTop=$("pTop"), pBot=$("pBot"), bTop=$("bTop"), bBot=$("bBot"), bt=$("battle");
    pTop.className="plat top"+(self?" hidden":""); bTop.classList.toggle("hidden",self); pBot.className="plat bot"; bt.classList.remove("quake");
    pBot.querySelector("img").src=SPRITE_URL[heroBottom.spr];
    bBot.innerHTML=boxHTML(heroBottom, heroBottom.hp);
    if(other){ const ti=pTop.querySelector("img"); ti.src=SPRITE_URL[other.spr]; ti.className="flip"; bTop.innerHTML=boxHTML(other, other.hp); }
    if(S.phase!=="enemy") S.fast=false;   // one tap skips the rest of the enemy turn
    bt.classList.remove("hidden");
    const aPlat = a===heroBottom ? pBot : pTop, tPlat = t===heroBottom ? pBot : pTop;
    const aBox = a===heroBottom ? bBot : bTop, tBox = t===heroBottom ? bBot : bTop;

    S.speed = a.team==="foe" ? 1.6 : 1;
    await typeMsg(`${a.name} used ${m.name}!`, 120);
    const r = resolve(a,t,m);
    aBox.querySelector(".mpb i").style.width=(a.mp/a.maxMp*100)+"%";
    if(!self && m.kind==="fight"){ aPlat.classList.add(a===heroBottom?"lunge-up":"lunge-down"); await wait(100); }
    await playFx(MOVE_FX[m.name], aPlat, tPlat);
    if(r.dmg){ tPlat.classList.add("hurt"); Sound.sfx("hit"); }
    tBox.querySelector(".hpb i").style.width=(t.hp/t.maxHp*100)+"%";
    tBox.querySelector(".hpb").classList.toggle("low", t.hp/t.maxHp<.3);
    tBox.querySelector(".num").textContent=`${t.hp}/${t.maxHp}`;
    await wait(80);

    const lines=[];
    if(r.crit) lines.push("A critical hit!");
    if(r.dmg!=null) lines.push(`${t.name} took ${r.dmg} damage${m.kind==="magic"?" (magic ignores armour)":""}.`);
    if(r.heal!=null) lines.push(r.heal ? `${t.name} recovered ${r.heal} HP!` : `${t.name} is already at full HP.`);
    if(r.stunned) lines.push(`${t.name} is stunned! 💤`);
    if(r.resisted) lines.push(`${t.name} shrugged off the stun.`);
    if(r.ko) lines.push(t.team==="foe" ? `${t.name} was defeated!` : `${t.name} is out of the fight!`);
    for(const l of lines){
      if(l.includes("defeated")||l.includes("out of the fight")){ tPlat.classList.add("faint"); Sound.sfx("ko"); }
      if(l.includes("stunned!")) Sound.sfx("stun");
      await typeMsg(l, 500);
    }
    bt.classList.add("hidden");
    if(S.phase!=="enemy") S.fast=false;
    return r;
  }

  async function perform(a,t,m){
    let r;
    if($("scenes").checked){ r = await battleScene(a,t,m); }
    else {
      r = resolve(a,t,m);
      Sound.sfx(r.heal!=null?"heal":r.ko?"ko":"hit"); S.hit.add(t.id); render(); await sleep(300); S.hit.clear();
    }
    if(r.dmg!=null) float(t,(r.crit?"CRIT ":"")+"-"+r.dmg,"var(--enemy)");
    if(r.heal) float(t,"+"+r.heal,"var(--heal)");

    log(`${a.name} used ${m.name}` + (r.dmg!=null?` → ${t.name} −${r.dmg}${r.crit?" (crit)":""}`:"") + (r.heal!=null?` → ${t.name} +${r.heal}`:"") + (r.stunned?` · ${t.name} stunned`:"") + (r.ko?` · ${t.name} ${t.team==="foe"?"defeated":"down"}!`:""));

  // ── area magic: hits every enemy inside the "+" ──
  async function castArea(a,cx,cy,m){
    a.mp-=m.mp||0; S.speed=1;
    const area=areaTiles(cx,cy,m.area), hit=alive(a.team==="hero"?"foe":"hero").filter(f=>area.has(K(f.x,f.y)));
    S.blast=new Set(); S.aoeAt=null; S.boom=area; render();
    Sound.sfx(m.type==="stun" ? "fog" : "boom");
    await wait(450);
    const parts=[];
    for(const t of hit){
      const r=resolve(a,t,{...m, mp:0});
      S.hit.add(t.id);
      if(r.dmg!=null) float(t,"-"+r.dmg,"var(--enemy)");
      if(r.stunned) float(t,"💤","var(--magic)");
      if(r.ko) Sound.sfx("ko");
      if(a.backup) S.backupDmg+=r.dmg||0;
      if(a.summoned) S.claudeDmg+=r.dmg||0;
      parts.push(`${t.name}${r.dmg!=null?` −${r.dmg}`:""}${r.stunned?" 💤":r.resisted?" (shrugged it off)":""}${r.ko?" defeated!":""}`);
    }
    if(hit.length) Sound.sfx("hit");
    S.boom=new Set(); render();
    await wait(400); S.hit.clear();
    log(`${a.name} used ${m.name} → ${parts.join(", ")}`);

  // ── backup arrives ──
  async function callBackup(){
    S.backupIn=true;
    const heroes=alive("hero");
    let spot=null, best=Infinity;   // free tile near the heroes, biased to the home (left) side
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      if(blocked(x,y) || unitAt(x,y)) continue;
      const s=Math.min(...heroes.map(h=>Math.abs(x-h.x)+Math.abs(y-h.y))) + x*2;
      if(s<best){ best=s; spot=[x,y]; }
    }
    if(!spot) return;
    const u={...BACKUP, id:S.units.length, maxHp:BACKUP.hp, maxMp:BACKUP.mp, x:spot[0], y:spot[1], alive:true, acted:false, stun:false};
    S.units.push(u); info.innerHTML="<b>Reinforcements incoming…</b>"; render();
    Sound.sfx("arrive");
    const healed=[];
    for(const h of heroes){ const amt=Math.min(RALLY_HEAL, h.maxHp-h.hp); h.hp+=amt; if(amt) healed.push([h,amt]); }
    if($("scenes").checked){
      const bt=$("battle"), pBot=$("pBot");
      $("pTop").className="plat top hidden"; $("bTop").classList.add("hidden"); pBot.className="plat bot"; bt.classList.remove("quake");
      pBot.querySelector("img").src=SPRITE_URL[u.spr]; $("bBot").innerHTML=boxHTML(u,u.hp);
      S.fast=false; S.speed=1; bt.classList.remove("hidden");
      await typeMsg("Reinforcements have arrived!");
      await playFx("heal", pBot, pBot);
      await typeMsg(`${u.name} joins the party. Everyone recovers ${RALLY_HEAL} HP.`);
      bt.classList.add("hidden"); S.fast=false;
    } else await sleep(400);
    for(const [h,amt] of healed) float(h,"+"+amt,"var(--heal)");
    log(`Reinforcements! ${u.name} joins the party. Everyone +${RALLY_HEAL} HP.`);
    render();
  }

  // ── enemy AI ──
  function planEnemy(e){
    const reach=reachable(e), heroes=alive("hero");
    let order=e.moves.filter(m=>canUse(e,m));
    if(order.length>1 && Math.random()<0.55) order=[order[1],order[0]]; // sometimes prefers magic
    for(const m of order){
      let best=null;
      for(const [k,steps] of reach){
        const [x,y]=k.split(",").map(Number);
        for(const h of heroes) if(inR(Math.abs(x-h.x)+Math.abs(y-h.y),m.rng)){
          const score=h.hp*10+steps; if(!best||score<best.score) best={x,y,t:h,m,score};
        }
      }
      if(best) return best;
    }
    let best=null;
    for(const [k,steps] of reach){
      const [x,y]=k.split(",").map(Number);
      const d=Math.min(...heroes.map(h=>Math.abs(x-h.x)+Math.abs(y-h.y)));
      const score=d*10+steps; if(!best||score<best.score) best={x,y,t:null,score};
    }
    return best;
  }

  async function enemyPhase(){
    S.phase="enemy"; S.busy=true; clearSel(); render();
    info.innerHTML="<b>Enemy turn…</b>";
    for(const e of alive("foe")) e.mp=Math.min(e.maxMp,e.mp+1);
    await wait(300);
    for(const e of alive("foe")){
      if(!alive("hero").length) break;
      if(e.stun){ e.stun=false; log(`${e.name} is stunned and loses a turn.`); float(e,"💤","var(--magic)"); render(); await wait(500); continue; }
      const p=planEnemy(e);
      if(p && (p.x!==e.x||p.y!==e.y)){ e.x=p.x; e.y=p.y; render(); await wait(250); }
      if(p && p.t){ await perform(e,p.t,p.m); await wait(120); }
      if(checkEnd()){ S.busy=false; return; }
    }
    S.turn++; S.phase="player"; S.fast=false;
    const stunned=[];
    for(const h of alive("hero")){
      h.mp=Math.min(h.maxMp,h.mp+1); h.acted=false;
      if(h.stun){ h.stun=false; h.acted=true; stunned.push(h.name); log(`${h.name} is stunned and loses a turn.`); }
    }
    if(!S.backupIn) await callBackup();   // Matt joins at the start of turn 2
    S.busy=false;
    info.innerHTML = stunned.length ? `${stunned.join(" & ")} ${stunned.length>1?"are":"is"} stunned this turn. Pick another hero.` : "Your turn. Pick a hero.";
    render();
    if(alive("hero").every(h=>h.acted)) enemyPhase();
  }

  const isDoor=(x,y)=>TOWN_OBJS.some(o=>o.enter && o.door[0]===x && o.door[1]===y);

  const objAt=(x,y)=>TOWN_OBJS.find(o=> o.k==="bld" ? x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h : o.k==="gate" ? x===o.x&&y>=o.y&&y<o.y+3 : o.k!=="offering" && y===o.y && x>=o.x && x<o.x+(o.w||1));
  const pickupAt=(x,y)=>PICKUPS.find(p=>p.x===x && p.y===y && !TOWN.taken.has(p.item));
  const canWalk=(x,y)=>x>=0&&y>=0&&x<TW&&y<TH&&!SOLID[y][x]&&!personAt(x,y)&&!pickupAt(x,y);

  function findPath(goal){   // shortest walk from the player to the first tile where goal(x,y) is true
    const sx=TOWN.x, sy=TOWN.y, prev=new Map([[K(sx,sy),null]]), q=[[sx,sy]];
    while(q.length){
      const [x,y]=q.shift();
      if(goal(x,y)){ const path=[]; let c=[x,y]; while(c && !(c[0]===sx&&c[1]===sy)){ path.unshift(c); c=prev.get(K(c[0],c[1])); } return path; }
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx, ny=y+dy;
        if(!canWalk(nx,ny) || prev.has(K(nx,ny)) || (isDoor(nx,ny) && !goal(nx,ny))) continue;
        prev.set(K(nx,ny),[x,y]); q.push([nx,ny]);
      }
    }
    return null;
  }

  // Tapping the map walks there. Tapping a person, snack, sign or building walks next to it and faces it;
  // tapping it again (or Space / Enter / E / Z) talks, picks up or reads. Walking into the Sloth's door goes inside.
  function townTap(tx,ty){
    if(TOWN.cut || TOWN.talk || !overlay.classList.contains("hidden")) return;
    const adj=(x,y)=>Math.abs(x-tx)+Math.abs(y-ty)===1;
    // already standing next to it? then act on it straight away
    const near=objAt(tx,ty), touching=d=>{ const [dx,dy]=d; return (TOWN.x+dx===tx && TOWN.y+dy===ty) || (near && near.k==="bld" && objAt(TOWN.x+dx,TOWN.y+dy)===near); };
    const dirNow=[[0,-1],[1,0],[-1,0],[0,1]].find(touching);
    if(!TOWN.path.length && dirNow && (personAt(tx,ty) || pickupAt(tx,ty) || isDoor(tx,ty) || (near && (near.say || near.enter)))){
      TOWN.face=dirNow; if(dirNow[0]) TOWN.dir=dirNow[0]; TOWN.dirty=true; doAction(); return;
    }
    const faceIt=()=>faceTo(tx,ty);
    const person=personAt(tx,ty), item=pickupAt(tx,ty), obj=objAt(tx,ty);
    let path=null, then=null;
    if(person || item){ path=findPath(adj); then=faceIt; }
    else if(obj && obj.enter) path=findPath(isDoor);
    else if(obj && obj.say){
      if(obj.k==="bld"){   // walk to the nearest tile touching the building, then face it
        path=findPath((x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>objAt(x+dx,y+dy)===obj));
        then=()=>{ const d=[[0,-1],[1,0],[-1,0],[0,1]].find(([dx,dy])=>objAt(TOWN.x+dx,TOWN.y+dy)===obj); if(d){ TOWN.face=d; if(d[0]) TOWN.dir=d[0]; } updateAct(); };
      } else { path=findPath(adj); then=faceIt; }
    }
    else if(canWalk(tx,ty)) path=findPath((x,y)=>x===tx&&y===ty);
    if(!path) return;
    TOWN.path=path; TOWN.onArrive=then; TOWN.dirty=true;
    if(!path.length && then){ TOWN.onArrive=null; then(); }
  }
  function faceTo(tx,ty){
    const dx=Math.sign(tx-TOWN.x), dy=Math.sign(ty-TOWN.y);
    TOWN.face = Math.abs(tx-TOWN.x)>=Math.abs(ty-TOWN.y) ? [dx,0] : [0,dy];
    if(TOWN.face[0]) TOWN.dir=TOWN.face[0];
    TOWN.dirty=true; updateAct();
  }

  // ── action button ── what's in front of you?
  function actionTarget(){
    const fx=TOWN.x+TOWN.face[0], fy=TOWN.y+TOWN.face[1];
    const person=personAt(fx,fy); if(person) return {label:"Talk", run:()=>{ person.dir = TOWN.x<person.x?-1:1; talk(person.name, person.lines); }};
    const p=pickupAt(fx,fy); if(p) return {label:"Pick up", run:()=>{
      TOWN.taken.add(p.item); INV[p.item]++; Sound.sfx("heal"); renderHud(); TOWN.dirty=true;
      const it=ITEMS[p.item]; talk(`You found ${it.name}! ${it.icon}`, [it.found]); }};
    if(isDoor(fx,fy)) return {label:"Enter", run:fightScene};
    const o=objAt(fx,fy); if(o && o.say) return {label:o.k==="sign"?"Read":"Look", run:()=>talk(o.label||"", [o.say])};
    return null;
  }
  function updateAct(){   // the canvas cursor hints when there's something in front of you
    TOWN.cv.style.cursor = !TOWN.talk && !TOWN.path.length && actionTarget() ? "help" : "pointer";
  }
  function doAction(){
    if(TOWN.talk){ advanceTalk(); return; }
    if(TOWN.cut) return;
    if(TOWN.path.length || !overlay.classList.contains("hidden")) return;
    const t=actionTarget(); if(t){ Sound.sfx("select"); t.run(); } else Sound.sfx("back");
    updateAct();
  }
  // (no on-screen button: Space / Enter / E / Z on a keyboard, or tap the thing again on a phone)

  function arriveTile(){
    if(isDoor(TOWN.x,TOWN.y)){ TOWN.path=[]; TOWN.onArrive=null; fightScene(); }
  }

  // Movement runs on a fixed 60-per-second tick and moves whole pixels in an even 1-1-2 rhythm (80px/s = 5 tiles/s),
  // so steps look the same on every screen, at any frame rate. Holding a direction key keeps walking without pausing.
  const TICK=1000/60, STEP=[1,1,2];
  const HELD=[];   // direction keys currently held, most recent last
  const heldDir=()=>HELD.length ? HELD[HELD.length-1] : null;
  function townUpdate(dt){
    if(!TOWN.path.length){ TOWN.acc=0; return false; }
    TOWN.acc=(TOWN.acc||0)+dt;
    while(TOWN.acc>=TICK && TOWN.path.length){ TOWN.acc-=TICK; stepTick(); }
    return true;
  }
  function stepTick(){
    const [nx,ny]=TOWN.path[0];
    if(!canWalk(nx,ny)){ TOWN.path=[]; updateAct(); return; }
    TOWN.face=[Math.sign(nx-TOWN.x), Math.sign(ny-TOWN.y)];
    if(TOWN.face[0]) TOWN.dir=TOWN.face[0];
    let ppx=Math.round(TOWN.px*TS), ppy=Math.round(TOWN.py*TS);
    const tx=nx*TS, ty=ny*TS, left=Math.abs(tx-ppx)+Math.abs(ty-ppy);
    const s=Math.min(STEP[TOWN.tick=((TOWN.tick||0)+1)%3], left);
    ppx+=Math.sign(tx-ppx)*s; ppy+=Math.sign(ty-ppy)*s; TOWN.walk+=s/TS;
    TOWN.px=ppx/TS; TOWN.py=ppy/TS;
    if(ppx!==tx || ppy!==ty) return;
    TOWN.x=nx; TOWN.y=ny; TOWN.path.shift(); Sound.sfx("step"); arriveTile();
    if(TOWN.path.length) return;
    const d=heldDir();   // still holding a direction? carry straight on
    if(d && !TOWN.cut && !TOWN.talk && overlay.classList.contains("hidden")){
      const hx=TOWN.x+d[0], hy=TOWN.y+d[1];
      if(canWalk(hx,hy)){ TOWN.path=[[hx,hy]]; return; }
      faceTo(hx,hy);
    }
    if(TOWN.onArrive){ const f=TOWN.onArrive; TOWN.onArrive=null; f(); }
    updateAct();
  }

  // the camera follows the player's *pixel* position, so the player never wobbles against the map
  function townCam(){
    const c=TOWN.cam, ppx=Math.round(TOWN.px*TS), ppy=Math.round(TOWN.py*TS);
    c.x=Math.max(0,Math.min(TW*TS-TOWN.vw, ppx+8-TOWN.vw/2));
    c.y=Math.max(0,Math.min(TH*TS-TOWN.vh, ppy+8-TOWN.vh/2));
  }
  // pick a whole-number zoom (2×, 3×…) so every art pixel is the same size on screen — no shimmer
  function sizeTown(){
    const box=$("town").getBoundingClientRect(); if(!box.width) return;
    const s=Math.max(2, Math.round(box.width/176)), even=n=>Math.ceil(n/2)*2;
    TOWN.scale=s; TOWN.vw=even(box.width/s); TOWN.vh=even(box.height/s);
    TOWN.cv.width=TOWN.vw; TOWN.cv.height=TOWN.vh;
    TOWN.cv.style.width=TOWN.vw*s+"px"; TOWN.cv.style.height=TOWN.vh*s+"px";
    townCam(); TOWN.dirty=true;
  }
  addEventListener("resize", ()=>{ if($("cg").dataset.screen==="town") sizeTown(); });

  // ── TOWN ART ── the same 16-bit treatment as the characters: three-tone shading lit from the top-left,
  // coloured outlines and soft shadows. Ground tiles, props and buildings are drawn once and cached.
  // shadeArt(w, h, ramps, build): build() fills a material map with spans; shading and outlines are automatic.
  function shadeArt(w,h,ramps,build){
    const M=Array.from({length:h},()=>Array(w).fill(null)), post=[];
    const span=(y,a,b,m)=>{ y=Math.round(y); if(y<0||y>=h) return; for(let x=Math.max(0,Math.round(a));x<=Math.min(w-1,Math.round(b));x++) M[y][x]=m; };
    const rect=(x,y,ww,hh,m)=>{ for(let j=y;j<y+hh;j++) span(j,x,x+ww-1,m); };
    const dot=(x,y,m)=>{ x=Math.round(x); y=Math.round(y); if(x>=0&&y>=0&&x<w&&y<h) M[y][x]=m; };
    const px=(x,y,col)=>post.push([x,y,col]);
    build({span,rect,dot,px,M});
    const other=(x,y,m)=>x<0||y<0||x>=w||y>=h||M[y][x]!==m;
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const g=cv.getContext("2d");
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const m=M[y][x]; let col=null;
      if(m){ const r=ramps[m]; col=r.base;
        if(r.tex && hsh(x,y,r.tex)>.78) col = hsh(x,y,r.tex+1)>.45 ? r.sh : r.hi;
        if(r.streak && hsh(x,Math.floor(y/4),r.streak)>.72) col = hsh(x,1,r.streak)>.5 ? r.sh : r.hi;   // thatch: vertical streaks
        if(!r.flat){ if(other(x,y-1,m)||other(x-1,y,m)) col=r.hi; if(other(x+1,y,m)||other(x,y+1,m)) col=r.sh; } }
      else for(const [dx,dy] of [[0,1],[-1,0],[1,0],[0,-1]]){ const nx=x+dx, ny=y+dy;
        if(nx>=0&&ny>=0&&nx<w&&ny<h&&M[ny][nx]&&!ramps[M[ny][nx]].noOl){ col=ramps[M[ny][nx]].ol; break; } }
      if(col){ g.fillStyle=col; g.fillRect(x,y,1,1); }
    }
    for(const [x,y,col] of post){ g.fillStyle=col; g.fillRect(x,y,1,1); }
    return cv;
  }
  const RP=(hex,o={})=>({...ramp(hex),...o});

  // ground tiles: a few cached variants of each, plus edges drawn against neighbours
  const GR={g:ramp("#6fae4c"), p:ramp("#d6b98a"), s:ramp("#f0d9a2"), w:ramp("#3196cb"), r:ramp("#84c24e"), f:ramp("#cbc1b0")};
  const TILE={};
  function tileArt(t,v,f){
    const key=t+v+"."+f; if(TILE[key]) return TILE[key];
    const cv=document.createElement("canvas"); cv.width=cv.height=TS; const g=cv.getContext("2d");
    const R=(col,x,y,w=1,h=1)=>{ g.fillStyle=col; g.fillRect(x,y,w,h); }, h=(i)=>hsh(v*13+i,t.charCodeAt(0),i);
    const r=GR[t]; R(r.base,0,0,16,16);
    if(t==="g"){
      for(let i=0;i<4;i++) R(r.sh,Math.floor(h(i)*14),Math.floor(h(i+20)*14),2,1);
      for(let i=0;i<3;i++){ const x=1+Math.floor(h(i+5)*12), y=2+Math.floor(h(i+9)*11); R(r.sh,x,y+1); R(r.hi,x+1,y); R(r.sh,x+2,y+1); R(mix(r.sh,.3,"k"),x+1,y+2); }   // tufts
      if(h(40)>.72){ const x=2+Math.floor(h(41)*11), y=2+Math.floor(h(42)*11), pet=["#fff3b0","#f7b6d2","#ffffff","#f2c14e"][Math.floor(h(43)*4)];
        R(pet,x,y); R(pet,x+2,y); R(pet,x+1,y-1); R(pet,x+1,y+1); R("#e08a2a",x+1,y); }   // wildflower
    }
    if(t==="p"){ for(let i=0;i<3;i++){ const x=1+Math.floor(h(i)*12), y=1+Math.floor(h(i+4)*12); R(r.hi,x,y,2,1); R(r.base,x,y+1); R(r.sh,x+1,y+1); R(r.sh,x+2,y); R(mix(r.sh,.3,"k"),x+2,y+1); }
      for(let i=0;i<5;i++) R(i%2?r.sh:r.hi,Math.floor(h(i+10)*15),Math.floor(h(i+15)*15)); }
    if(t==="s"){ for(let i=0;i<3;i++){ const x=Math.floor(h(i)*11), y=2+Math.floor(h(i+3)*12); R(r.hi,x,y,4,1); R(r.sh,x+1,y+1,3,1); } for(let i=0;i<4;i++) R(r.sh,Math.floor(h(i+8)*15),Math.floor(h(i+12)*15)); }
    if(t==="w"){
      for(let k=0;k<3;k++){ const x=(Math.floor(h(k)*16)+f*2+k*5)%13, y=2+k*4; R(r.hi,x,y,4,1); R(mix(r.hi,.4,"w"),x+1,y,2,1); }
      if((f+v)%4===0) R("#ffffff",Math.floor(h(30)*14),1+Math.floor(h(31)*8)); }   // sparkle
    if(t==="r"){ R(mix(r.sh,.25,"k"),0,0,16,1); R(r.hi,0,1,16,1); R("#9fd6e6",0,9,16,1); R("#c7ecf3",Math.floor(h(1)*10),9,4,1);
      for(let i=1;i<16;i+=3){ R(r.sh,i,3,1,4); R(r.hi,i,3); R(r.sh,(i+1)%16,11,1,4); R(r.hi,(i+1)%16,11); } }
    if(t==="f"){ for(const [bx,by] of [[0,0],[8,0],[v%2?4:0,8],[v%2?12:8,8]]){ R(r.hi,bx,by,8,1); R(r.hi,bx,by,1,8); R(r.sh,bx,by+7,8,1); R(r.sh,bx+7,by,1,8); }
      if(h(5)>.6) R("#7fa35a",3+Math.floor(h(6)*9),3+Math.floor(h(7)*9),2,1); }
    return (TILE[key]=cv);
  }
  function drawGround(c,x,y){
    const g=GROUND[y][x], px=x*TS, py=y*TS, v=Math.floor(hsh(x,y,77)*4), f=g==="w"?TOWN.frame%8:0;
    c.drawImage(tileArt(g,v,f),px,py);
    const R=(col,a,b,w=1,h=1)=>{ c.fillStyle=col; c.fillRect(px+a,py+b,w,h); };
    const nb=(dx,dy)=>{ const xx=x+dx, yy=y+dy; return yy<0||yy>=TH||xx<0||xx>=TW ? g : GROUND[yy][xx]; };
    const G=GR.g;
    if(g==="p"||g==="s"){   // grass grows over the edge of paths and sand, with a little shadow under it
      if(nb(0,-1)==="g") for(let i=0;i<16;i++){ const d=hsh(x+i,y,3)>.55?2:1; R(G.base,i,0,1,d); R(G.sh,i,d,1,1); }
      if(nb(0,1)==="g") for(let i=0;i<16;i++) if(hsh(x+i,y,4)>.5) R(G.hi,i,15);
      if(nb(-1,0)==="g") for(let j=0;j<16;j++){ const d=hsh(x,y+j,5)>.55?2:1; R(G.base,0,j,d,1); R(G.sh,d,j,1,1); }
      if(nb(1,0)==="g") for(let j=0;j<16;j++) if(hsh(x,y+j,6)>.5) R(G.base,15,j);
    }
    if(g==="s" && nb(0,-1)==="p") R(GR.s.sh,0,0,16,1);
    if(g==="w"){
      let depth=0; for(let k=1;k<=3;k++) if(nb(0,-k)==="w") depth++; if(depth){ c.fillStyle=`rgba(8,40,90,${depth*.09})`; c.fillRect(px,py,16,16); }   // deeper further from shore
      if(nb(0,-1)==="s"){ const f2=TOWN.frame%2; R("#ffffff",0,f2,16,2); R("#cdeefa",0,2+f2,16,1); for(let i=0;i<16;i+=3) R("#ffffff",(i+TOWN.frame)%16,3+f2); }   // foam
      for(const [dx,dy,a,b,w,h] of [[0,-1,0,0,16,2],[0,1,0,14,16,2],[-1,0,0,0,2,16],[1,0,14,0,2,16]]) if(nb(dx,dy)==="g"){ R("#eef4f2",a,b,w,h); R("#b9c6c8",a+(w===2?1:0),b+(h===2?1:0),w===2?1:w,h===2?1:h); }   // pool coping
    }
  }

  // shadows cast to the bottom-right (drawn on the ground before anything stands on it)
  function castShadow(c,o){
    c.fillStyle="rgba(18,40,20,.22)";
    const px=o.x*TS, py=o.y*TS;
    if(o.k==="bld"){ const W=o.w*TS, H=o.h*TS; c.fillRect(px+W,py+6,4,H-4); c.fillRect(px+4,py+H,W,3); }
    else if(o.k==="palm"){ c.beginPath(); c.ellipse(px+12,py+14,9,3,0,0,7); c.fill(); }
    else if(o.k==="gate"){ c.fillRect(px+16,py+8,3,40); }
    else if(o.k!=="offering" && o.k!=="hammock"){ c.beginPath(); c.ellipse(px+9,py+14,7,2,0,0,7); c.fill(); }
  }

  const BLD={
    warung:{roof:"#c0563a", wall:"#f1e3c8", trim:"#8a5a32", glass:"#8ed0e6", tile:true},
    cafe:  {roof:"#c9a25b", wall:"#8a5a3c", trim:"#5a3a22", glass:"#f5d68a", planks:true},
    villa: {roof:"#3d4f5c", wall:"#f7f3ea", trim:"#b9a98f", glass:"#8ed0e6", tile:true},
    surf:  {roof:"#e2d3ab", wall:"#4aa3c4", trim:"#2f7fa0", glass:"#f4ede4", wave:true},
    shala: {roof:"#c9a25b", wall:null,      trim:"#8a5a32"},
    sloth: {roof:"#c9a25b", wall:"#d8b56a", trim:"#8a5a32", glass:"#f5d68a", bamboo:true},
  };
  const BLD_ART=new Map();
  function bldArt(o){
    if(BLD_ART.has(o)) return BLD_ART.get(o);
    const s=BLD[o.style], W=o.w*TS+4, H=o.h*TS, roofH=Math.round(H*.55), thatch=!s.tile;
    const ramps={ roof:RP(s.roof,{streak:thatch?11:0}), wall:RP(s.wall||"#c9a77a",{tex:s.wall?0:3}), trim:RP(s.trim), glass:RP(s.glass||"#8ed0e6"),
      door:RP(o.enter?"#4a2e1e":"#6b4a2e"), post:RP("#7a5a3a"), plat:RP("#c9a77a"), sign:RP("#5a3a22"), board:RP("#f4ede4",{flat:true,noOl:true}),
      mat1:RP("#7fb3c9"), mat2:RP("#d96fa8") };
    const art=shadeArt(W,H+2,ramps,({span,rect,dot,px})=>{
      if(s.wall){ rect(2,roofH-2,W-4,H-roofH+2,"wall");
        for(let i=0;i<o.w;i++){ if(o.door && o.x+i===o.door[0]) continue; rect(2+i*16+3,roofH+3,10,8,"trim"); rect(2+i*16+4,roofH+4,8,6,"glass"); }
        if(o.door){ const dx=2+(o.door[0]-o.x)*16; rect(dx+3,H-13,10,13,"trim"); rect(dx+4,H-12,8,12,"door"); }
      } else { rect(0,H-6,W,6,"plat"); rect(2,roofH-2,3,H-roofH-4,"post"); rect(W-5,roofH-2,3,H-roofH-4,"post"); rect(10,H-9,12,3,"mat1"); rect(W-24,H-9,12,3,"mat2"); }
      for(let y=0;y<roofH;y++){ const inset=Math.max(0,Math.round((4-y)*1.2)); span(y,inset,W-1-inset,"roof"); }   // rounded ridge, full-width eaves
      if(o.style==="sloth"){ const sx=Math.round(W/2)-15, sy=roofH-14; rect(sx,sy,30,16,"sign"); rect(sx+1,sy+1,28,14,"board"); }
      // details painted after shading
      const R=ramp(s.roof);
      for(let y=4;y<roofH-1;y+=4) for(let x=2;x<W-2;x++){ px(x,y,R.sh); if(!thatch && x%6===(y/4%2)*3) px(x,y-1,R.sh); }   // roof courses / tiles
      if(thatch) for(let x=3;x<W-3;x+=3) px(x,roofH-1,R.sh);                                                           // thatch fringe
      if(s.wall){ const Wr=ramp(s.wall); for(let x=2;x<W-2;x++){ if(o.style==="sloth" && Math.abs(x-W/2)<=15) continue; px(x,roofH-1,Wr.sh); px(x,roofH,Wr.sh); }   // eave shadow (not over the sign)
        if(s.bamboo) for(let x=4;x<W-3;x+=4) for(let y=roofH+1;y<H-1;y++) if(y%7) px(x,y,Wr.sh);
        if(s.planks) for(let y=roofH+3;y<H-1;y+=3) for(let x=3;x<W-3;x++) if((x+y)%9) px(x,y,Wr.sh);
        if(s.wave) for(let x=3;x<W-3;x++) px(x,H-4+Math.round(Math.sin(x/3)),"#f4ede4");
        for(let i=0;i<o.w;i++){ if(o.door && o.x+i===o.door[0]) continue; px(2+i*16+5,roofH+5,"#ffffff"); px(2+i*16+6,roofH+5,"#ffffff"); px(2+i*16+5,roofH+6,"#ffffff"); } }
      if(o.door){ const dx=2+(o.door[0]-o.x)*16; px(dx+10,H-6,"#e5b340"); }
      if(o.style==="sloth"){   // the sign: a happy sloth raising a pint

  function drawObj(c,o){

      const sway=Math.round(Math.sin(TOWN.now/600)), C=(col,x,y,w,h)=>{ c.fillStyle=col; c.fillRect(x,y,w,h); };
      C("rgba(18,40,20,.2)",px+4,py+13,24,2);
      for(let i=0;i<6;i++){ C("#d9c39a",px-6+i,py+2+i,1,1); C("#d9c39a",px+37-i,py+2+i,1,1); }   // ropes
      if(TOWN.sleeping && SPR_CV.player){
        c.save(); c.translate(px+16,py+7+sway); c.rotate(-Math.PI/2); c.drawImage(SPR_CV.player,-12,-15); c.restore();
        for(let i=0;i<2;i++){ const t=((TOWN.now/700)+i*1.5)%3, zx=px+22+i*5+Math.round(t*2), zy=py-2-Math.round(t*5);
          c.globalAlpha=Math.max(0,1-t/3); C("#ffffff",zx,zy,3,1); C("#ffffff",zx+1,zy+1,1,1); C("#ffffff",zx,zy+2,3,1); c.globalAlpha=1; }
      }
      for(let i=0;i<28;i++){ const yy=py+7+Math.round(Math.sin(i/27*Math.PI)*4)+sway; C(i%4<2?"#e0782b":"#3aa0a0",px+2+i,yy,1,4); C("#7a3b1e",px+2+i,yy+4,1,1); }

  // walking: alternate a "legs apart" stride frame with the normal stance (which dips 1px as the foot lands)
  const STRIDE=new Map();
  function strideFrame(cv){
    if(STRIDE.has(cv)) return STRIDE.get(cv);
    const f=document.createElement("canvas"); f.width=SW; f.height=SW; const g=f.getContext("2d");
    g.drawImage(cv,0,0);
    const L=g.getImageData(0,18,12,5), R=g.getImageData(12,18,12,5);   // the legs
    g.clearRect(0,18,SW,5); g.putImageData(L,-1,18); g.putImageData(R,1,18);
    STRIDE.set(cv,f); return f;
  }
  function drawChar(c,key,x,y,dir,walk){
    const base=SPR_CV[key]; if(!base) return;
    const px=Math.round(x*TS), py=Math.round(y*TS);
    let img=base, lift=0;
    if(walk!=null){ const stride=Math.floor(walk*4)%2===1; img = stride ? strideFrame(base) : base; }   // 2 steps per tile; idle = stand still
    c.fillStyle="rgba(0,0,0,.2)"; c.fillRect(px+3,py+12,10,3);   // characters are 24px tall: feet near the bottom of their tile
    const top=py-10-lift-(key==="player" ? TOWN.hopLift||0 : 0);
    if(dir<0){ c.save(); c.translate(px+8,0); c.scale(-1,1); c.drawImage(img,-12,top); c.restore(); }
    else c.drawImage(img,px-4,top);
  }

  function townDraw(){
    const c=TOWN.ctx, cam=TOWN.cam;
    c.setTransform(1,0,0,1,-cam.x,-cam.y);
    const x0=Math.floor(cam.x/TS), y0=Math.floor(cam.y/TS), x1=Math.min(TW-1,x0+Math.ceil(TOWN.vw/TS)), y1=Math.min(TH-1,y0+Math.ceil(TOWN.vh/TS));
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) drawGround(c,x,y);
    for(const o of TOWN_OBJS) castShadow(c,o);
    const things=[];   // y-sorted so things lower on the map draw in front
    for(const o of TOWN_OBJS) things.push({by:o.k==="bld"?o.y+o.h-1 : o.k==="gate"?o.y+2 : o.y, z:o.k==="offering"?-1:0, draw:()=>drawObj(c,o)});
    for(const p of PICKUPS) if(!TOWN.taken.has(p.item)) things.push({by:p.y, z:0, draw:()=>drawPickup(c,p)});
    for(const p of PEOPLE) things.push({by:p.y, z:1, draw:()=>drawChar(c, p.spr||"npc:"+p.name, p.x, p.y, p.dir||1, null)});
    if(!TOWN.sleeping) things.push({by:TOWN.py, z:2, draw:()=>drawChar(c,"player",TOWN.px,TOWN.py,TOWN.dir, TOWN.path.length ? TOWN.walk : null)});
    things.sort((a,b)=>a.by-b.by || a.z-b.z).forEach(t=>t.draw());
    c.setTransform(1,0,0,1,0,0);
    placeLabels();
  }

  function buildLabels(){
    const box=$("tlabels"); box.innerHTML=""; TOWN.labels=[];
    for(const o of TOWN_OBJS) if(o.k==="bld"){ const l=document.createElement("span"); l.className="tlbl"+(o.enter?" main":""); l.textContent=o.label; box.appendChild(l); TOWN.labels.push([l,o]); }
  }
  function placeLabels(){
    for(const [l,o] of TOWN.labels){
      const x=(o.x*TS+o.w*TS/2-TOWN.cam.x)*TOWN.scale, y=(o.y*TS-3-TOWN.cam.y)*TOWN.scale;
      l.style.left=x+"px"; l.style.top=y+"px"; l.hidden = x<-80 || x>TOWN.vw*TOWN.scale+80 || y<10 || y>TOWN.vh*TOWN.scale;

  // dialogue box (people, signs, found items)
  function talk(name, lines, done){ TOWN.talk={name, lines:[...lines], i:0, done}; showTalk(); }
  function showTalk(){

    if(!t){ el.classList.add("hidden"); updateAct(); return; }
    el.innerHTML=""; const b=document.createElement("b"); b.textContent=t.name; const p=document.createElement("div"); p.textContent=t.lines[t.i];
    const m=document.createElement("span"); m.className="more"; m.textContent=t.i<t.lines.length-1?"▼":"✕";

  function advanceTalk(){

  TOWN.cv.onclick=e=>{
    if(TOWN.talk){ advanceTalk(); return; }   // tapping anywhere moves the conversation on
    const r=TOWN.cv.getBoundingClientRect();
    const tx=Math.floor(((e.clientX-r.left)/r.width*TOWN.vw+TOWN.cam.x)/TS);
    let ty=Math.floor(((e.clientY-r.top)/r.height*TOWN.vh+TOWN.cam.y)/TS);
    if(!personAt(tx,ty) && (personAt(tx,ty+1) || (TOWN.x===tx && TOWN.y===ty+1))) ty++;   // characters are taller than a tile: a tap on their head counts
    townTap(tx,ty);
  };
  document.addEventListener("keydown", e=>{
    if($("cg").dataset.screen!=="town" || !overlay.classList.contains("hidden")) return;
    if([" ","Enter","e","E","z","Z"].includes(e.key)){ e.preventDefault(); doAction(); return; }   // the A button
    if(TOWN.talk || TOWN.cut) return;
    const d=DIRS[e.key];
    if(!d) return;
    e.preventDefault();
    if(!HELD.includes(d)) HELD.push(d);
    if(TOWN.path.length) return;   // already walking: the held key carries on at the next tile
    const nx=TOWN.x+d[0], ny=TOWN.y+d[1];
    if(canWalk(nx,ny)){ TOWN.path=[[nx,ny]]; TOWN.onArrive=null; updateAct(); } else faceTo(nx,ny);   // blocked: just turn to face it
    TOWN.dirty=true;
  });
  const DIRS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
  document.addEventListener("keyup", e=>{ const d=DIRS[e.key]; if(d){ const i=HELD.indexOf(d); if(i>=0) HELD.splice(i,1); } });
  addEventListener("blur", ()=>{ HELD.length=0; });

  function townLoop(now){
    if($("cg").dataset.screen!=="town"){ TOWN.raf=0; return; }
    const dt=Math.min(50, now-(TOWN.last||now)); TOWN.last=now; TOWN.now=now;
    const moved=townUpdate(dt), f=Math.floor(now/350);
    if(f!==TOWN.frame){ TOWN.frame=f; TOWN.dirty=true; }
    if(TOWN.hop){   // hopping out of the hammock
      const h=TOWN.hop, p=Math.min(1,(now-h.t0)/h.dur);
      TOWN.px=h.from[0]+(TOWN.x-h.from[0])*p; TOWN.py=h.from[1]+(TOWN.y-h.from[1])*p; TOWN.hopLift=Math.round(Math.sin(p*Math.PI)*7); TOWN.dirty=true;
      if(p>=1){ TOWN.hop=null; TOWN.hopLift=0; TOWN.px=TOWN.x; TOWN.py=TOWN.y; h.done(); }
    }
    if(moved || TOWN.dirty){ townCam(); townDraw(); TOWN.dirty=false; }
    TOWN.raf=requestAnimationFrame(townLoop);
  }

  function enterTown(){
    setScreen("town");
    for(const k in INV) INV[k]=0; TOWN.taken.clear();
    Object.assign(TOWN,{x:1,y:9,px:1,py:9,dir:1,face:[0,1],walk:0,path:[],onArrive:null,talk:null});
    SPR_CV.player=makeSprite(P); STRIDE.clear();
    sizeTown(); buildLabels(); renderHud(); showTalk();
    info.innerHTML=`<b>Canggu, Bali 🌴</b><div class="stats">Tap the map to walk (or arrow keys). Tap someone or something to walk up to it, then tap it again to talk, look or pick it up (or press Space).</div>`;

  // ── CUTSCENES ──
  const fade=(on,ms=850)=>new Promise(r=>{ const f=$("fade"); f.style.transitionDuration=ms+"ms"; f.classList.toggle("on",on); setTimeout(r,ms+30); });
  const talkP=(name,lines)=>new Promise(r=>talk(name,lines,r));
  const hop=from=>new Promise(r=>{ TOWN.hop={from, t0:performance.now(), dur:420, done:r}; });

  // Opening: you wake up in your hammock
  async function openingScene(){
    TOWN.cut=true; TOWN.sleeping=true;
    Object.assign(TOWN,{x:7,y:8,px:7.5,py:7,dir:1,face:[0,1]});
    const f=$("fade"); f.style.transition="none"; f.classList.add("on"); void f.offsetWidth; f.style.transition="";
    townCam(); TOWN.dirty=true; Sound.stop();
    await sleep(300); Sound.sfx("rooster"); await fade(false,1400); Sound.play("morning"); await sleep(900);
    await talkP("", ["☀️ It's a beautiful morning in Canggu, Bali.", "Roosters crowing. Scooters buzzing. Waves rolling in.", "What could possibly go wrong?"]);
    // a quick blink, and you're up: standing in front of the hammock
    await fade(true,350); TOWN.sleeping=false; Object.assign(TOWN,{px:7,py:8,dir:1,face:[0,1]}); townCam(); TOWN.dirty=true;
    await sleep(200); await fade(false,350);
    await talkP(P.name||"You", ["*Yaaawn*… Right. Let's see what today brings."]);
    Sound.play("cafe"); TOWN.cut=false; updateAct();
  }

  // Walking into The Sloppy Sloth: the suits are inside
  const CUT={next:null};
  function cutTalk(lines){   // lines: [spriteKey, name, text]
    return new Promise(res=>{
      let i=0; const box=$("cut");
      const show=()=>{
        const [spr,name,text]=lines[i]; box.innerHTML="";
        const im=new Image(); im.src=SPRITE_URL[spr]; im.alt="";
        const body=document.createElement("div"), nm=document.createElement("b"), tx=document.createElement("div"), more=document.createElement("span");
        nm.textContent=name; tx.textContent=text; more.className="more"; more.textContent=i<lines.length-1?"▼":"✕";
        body.append(nm,tx); box.append(im,body,more); box.classList.remove("hidden");
      };
      CUT.next=()=>{ Sound.sfx("blip"); if(++i>=lines.length){ box.classList.add("hidden"); CUT.next=null; res(); } else show(); };
      show();
    });
  }
  $("cut").onclick=()=>{ if(CUT.next) CUT.next(); };
  document.addEventListener("keydown", e=>{ if(CUT.next && [" ","Enter","e","E","z","Z"].includes(e.key)){ e.preventDefault(); CUT.next(); } });
  function banner(text){
    return new Promise(r=>{ const b=$("banner"); b.textContent=text; b.classList.remove("hidden"); b.style.animation="none"; void b.offsetWidth; b.style.animation="";
      Sound.sfx("arrive"); setTimeout(()=>{ b.classList.add("hidden"); r(); }, 1000); });
  }
  async function fightScene(){
    if(TOWN.cut) return;
    TOWN.cut=true; TOWN.path=[]; Sound.stop();
    await fade(true);
    setScreen("battle"); reset(); S.busy=true; render();
    info.innerHTML="<b>The Sloppy Sloth 🦥</b>";
    await sleep(250); await fade(false);
    await cutTalk([
      ["manager", "Middle Manager", "Oh! Hi. We just bought this place. Surprise!"],
      ["ceo", "The CEO", "By Monday it's “Sloth Space”. Hot desks, cold brew, kombucha on tap."],
      ["consult", "Consultant", "Your vibe is… not on-brand. We'll need you to leave."],
      ["player", S.units[0].name, "Not my Sloppy Sloth. Not today."],
    ]);
    await banner("FIGHT!");
    Sound.play("battle"); S.busy=false; TOWN.cut=false;
    info.innerHTML=`Tap <b>${S.units[0].name}</b> → tap a <b style="color:var(--hero)">blue</b> tile to move → pick a move → tap a target. Snacks you found are in the move list.`;
    render();
  }

  // NPC sprites, built with the same generator as your hero
  SPR_CV.matthew=makeSprite(CAST.matthew);
  for(const p of PEOPLE) if(p.look) SPR_CV["npc:"+p.name]=makeSprite(p.look);

  const sndBtn=$("snd"); const paintSnd=()=>{ sndBtn.textContent=Sound.on?"🔊":"🔇"; }; paintSnd();
  sndBtn.onclick=()=>{ Sound.init(); Sound.setOn(!Sound.on); paintSnd(); };

  // Size the parent iframe to fit the game. Grow-only, so the page doesn't jump as panels change.
  // Runs after every render, plus a ResizeObserver for anything else (fonts, rotation).
  try { const fe = window.frameElement; if (fe) { let h = 0;
    fitFrame = () => { const n = Math.ceil(document.body.getBoundingClientRect().height); if (n > h) { h = n; fe.style.height = h + "px"; } };
    new ResizeObserver(() => setTimeout(fitFrame)).observe(document.body); } } catch(e) {}

  reset();
  showTitle();
})();
</script>
</body>
</html>
