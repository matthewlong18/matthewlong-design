<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Start-up Adventure Time</title>
<style>
  :root{
    --bg:#f4ede4; --panel:#fffaf3; --ink:#3b2a20; --muted:#8a7565;
    --t1:#e9c890; --t2:#e2be84; --water:#9cc3cf; --rack:#cdbba3;
    --hero:#3a6ea5; --enemy:#b5483b; --heal:#4f8a5b; --line:#d9c9b3;
    --fight:#d9822b; --magic:#8a5cc7; --sky:#d6e8ee; --ground:#dccaa8; --plat:#c4ae88;
    --grass:#c5d6a4; --grass2:#bccf99; --cobble:#e2d6c4; --counter:#9a6a44;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1511; --panel:#261d17; --ink:#f1e6d8; --muted:#a8937f;
      --t1:#7a5534; --t2:#6f4c2e; --water:#2f5561; --rack:#4a3a2e;
      --hero:#6a9bd1; --enemy:#d86b5c; --heal:#74b383; --line:#45362a;
      --fight:#e89a4a; --magic:#a883e0; --sky:#24333a; --ground:#3a2e22; --plat:#4d3e2e;
      --grass:#34402a; --grass2:#303b27; --cobble:#3a3029; --counter:#5a3b26;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:16px;overflow-x:hidden}
  .cg{width:100%;max-width:600px;--cell:min(68px,calc((100vw - 32px)/8))}
  .cg h1{font-size:20px;margin:0 0 2px;letter-spacing:.3px}
  .cg .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;gap:8px}
  .phase{font-weight:700;padding:3px 10px;border-radius:99px;background:var(--hero);color:#fff}
  .phase.enemy{background:var(--enemy)}
  .wrap{position:relative;width:calc(var(--cell)*8);margin:0 auto;border-radius:10px;overflow:hidden;border:3px solid #3b2417}
  .board{position:relative;z-index:1;display:grid;grid-template-columns:repeat(8,var(--cell));grid-auto-rows:var(--cell)}
  .arena{position:absolute;left:0;top:0;width:100%;height:calc(var(--cell)*6);image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}   /* the pixel-art bar floor under the board */
  html{-webkit-tap-highlight-color:transparent}   /* no blue flash when tapping the map or board on a phone */
  #townCv,.tile,.battle,.wrap button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #townCv{outline:none}
  input{-webkit-user-select:text;user-select:text}
  .tile{position:relative;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
  .tile.alt{background:transparent}
  .tile.water{background:var(--water);cursor:default}
  .tile.rack{background:transparent;cursor:default}
  .tile.counter{background:transparent;cursor:default}
  .tile.disco::after{animation:disco .3s steps(1) infinite}
  @keyframes disco{0%{background:rgba(255,80,160,.35)}33%{background:rgba(80,200,255,.35)}66%{background:rgba(255,220,80,.35)}}
  .tile::after{content:"";position:absolute;inset:0;pointer-events:none}
  .tile.move::after{background:color-mix(in srgb,var(--hero) 30%,transparent);box-shadow:inset 0 0 0 1px var(--hero)}
  .tile.danger::after{background:color-mix(in srgb,var(--enemy) 18%,transparent)}
  .tile.range::after{background:color-mix(in srgb,var(--fight) 14%,transparent)}
  .tile.target::after{background:color-mix(in srgb,var(--enemy) 40%,transparent);box-shadow:inset 0 0 0 2px var(--enemy);animation:pulse 1s infinite}
  .tile.healt::after{background:color-mix(in srgb,var(--heal) 40%,transparent);box-shadow:inset 0 0 0 2px var(--heal);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .tile.aoe::after{background:color-mix(in srgb,var(--magic) 38%,transparent);box-shadow:inset 0 0 0 2px var(--magic)}
  .tile.boom::after{z-index:2;background:radial-gradient(circle,#fff 0 16%,var(--magic) 42%,transparent 70%);animation:boom .5s ease-out forwards}
  @keyframes boom{from{opacity:1;transform:scale(.35)}to{opacity:0;transform:scale(1.5)}}
  .unit{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center}
  .unit::before{content:"";position:absolute;bottom:8%;left:20%;right:20%;height:16%;border-radius:50%;background:color-mix(in srgb,var(--hero) 45%,transparent);border:2px solid var(--hero)}
  .unit.foe::before{background:color-mix(in srgb,var(--enemy) 45%,transparent);border-color:var(--enemy)}
  .unit.neutral::before{background:color-mix(in srgb,#8a7565 40%,transparent);border-color:#8a7565}
  .spr{position:relative;width:88%;height:88%;margin-bottom:10%;image-rendering:pixelated;image-rendering:crisp-edges;animation:bob 1.2s steps(2) infinite}
  .unit.foe .spr{transform:scaleX(-1)}
  @keyframes bob{50%{translate:0 -2px}}
  .unit.sel .spr{animation-duration:.5s}
  .unit.sel::before{box-shadow:0 0 0 3px var(--panel),0 0 10px var(--hero)}
  .unit.done{filter:grayscale(1);opacity:.55}
  .unit.done .spr{animation:none}
  .unit.hit .spr{animation:shake .3s}
  .zz{position:absolute;top:0;right:8%;font-size:12px;font-weight:800;color:var(--magic);z-index:2}
  @keyframes shake{25%{translate:-4px 0;filter:brightness(2)}75%{translate:4px 0}}
  .hp{position:absolute;left:15%;right:15%;bottom:2px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
  .hp i{display:block;height:100%;background:var(--heal)}
  .foe .hp i{background:var(--enemy)}
  .fx{position:absolute;inset:0;pointer-events:none}
  .float{position:absolute;width:calc(100%/8);text-align:center;font-weight:800;font-size:18px;animation:up .9s forwards;text-shadow:0 1px 0 var(--panel),0 -1px 0 var(--panel),1px 0 0 var(--panel),-1px 0 0 var(--panel)}
  @keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-28px);opacity:0}}

  /* ── battle scene ── */
  .battle{position:absolute;inset:0;z-index:4;background:linear-gradient(#e8c27a 0 52%,#c99a62 52%);image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;overflow:hidden}
  .plat{position:absolute;width:32%;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center}
  .plat::before{content:"";position:absolute;bottom:2%;left:0;right:0;height:22%;border-radius:50%;background:#a8743f;box-shadow:inset 0 3px 0 rgba(255,235,200,.25)}
  .plat.top{right:5%;top:3%}
  .plat.bot{left:5%;bottom:25%}
  .plat img{position:relative;width:78%;margin-bottom:9%;image-rendering:pixelated;image-rendering:crisp-edges;animation:bob 1s steps(2) infinite}
  .plat img.flip{transform:scaleX(-1)}
  .plat.lunge-up img{animation:lup .35s}
  .plat.lunge-down img{animation:ldown .35s}
  @keyframes lup{50%{translate:30% -22%}}
  @keyframes ldown{50%{translate:-30% 22%}}
  .plat.hurt img{animation:hurt .45s}
  @keyframes hurt{20%,60%{opacity:.2;translate:-5% 0}40%,80%{opacity:1;translate:5% 0}}
  .plat.faint img{animation:faint .5s forwards}
  @keyframes faint{to{translate:0 60%;opacity:0}}
  .burst{position:absolute;inset:10%;border-radius:50%;pointer-events:none;animation:burst .55s forwards}
  @keyframes burst{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}
  .bx{position:absolute;width:48%;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:3px 3px 0 color-mix(in srgb,var(--ink) 25%,transparent)}
  .bx.top{left:4%;top:7%}
  .bx.bot{right:4%;bottom:27%}
  .bx .nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bx .row{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10px;font-weight:800;color:var(--muted)}
  .bar2{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar2 i{display:block;height:100%;transition:width .5s}
  .bar2.hpb i{background:var(--heal)}
  .bar2.hpb.low i{background:var(--enemy)}
  .bar2.mpb i{background:var(--magic)}
  .bx .num{text-align:right;font-size:11px;margin-top:2px;color:var(--muted)}
  .msg{position:absolute;left:3%;right:3%;bottom:3%;height:20%;background:var(--panel);border:3px double var(--ink);border-radius:8px;padding:6px 12px;font-weight:700;font-size:clamp(12px,3.3vw,15px);display:flex;align-items:center;line-height:1.3}
  .fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  .battle.quake{animation:quake .35s}
  @keyframes quake{20%{translate:-6px 3px}40%{translate:5px -4px}60%{translate:-4px 2px}80%{translate:3px -1px}}
  .msg,.bx{z-index:3}
  .skip{z-index:4;position:absolute;right:5%;bottom:5%;font-size:10px;color:var(--muted);font-weight:600}
  @media (max-width:420px){
    .bx{width:42%;padding:3px 6px;border-width:1px;font-size:10px}
    .bx .nm{font-size:11px}
    .bx .row{margin-top:2px;font-size:9px}
    .bar2{height:5px}
    .bx .num{display:none}
    .bx.top{top:4%}
    .bx.bot{bottom:24%}
  }

  /* ── panel & menu ── */
  .panel{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
  .info{min-height:66px}
  .info b{font-size:15px}
  .stats{color:var(--muted);font-size:12px;margin-top:2px}
  /* fixed-ish heights so the panel (and the iframe around it) doesn't jump as the menu changes */
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;min-height:152px;align-content:start}
  .menu .hint{grid-column:1/-1;font-size:12px;color:var(--muted)}
  .menu .aux{padding:6px 12px;font-size:12px}
  @media (max-width:420px){
    .menu{gap:6px;min-height:140px}
    button.mv{padding:6px 8px;border-left-width:4px}
    button.mv b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    button.mv small{font-size:10px;line-height:1.3}
  }
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
  button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  button.cmd{font-size:15px;font-weight:800;padding:12px 14px;border:2px solid var(--ink)}
  button.cmd.fight{border-left:8px solid var(--fight)}
  button.cmd.magic{border-left:8px solid var(--magic)}
  button.mv{border-left:6px solid var(--fight);padding:8px 10px}
  button.mv.magic{border-left-color:var(--magic)}
  button.mv b{display:block;font-size:14px}
  button.mv small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
  button:disabled{opacity:.4;cursor:default}
  .log{margin-top:10px;font-size:12px;color:var(--muted);height:66px;overflow:auto;line-height:1.5}
  .snd{padding:3px 8px;font-size:14px;line-height:1}
  .toggle{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
  .overlay{position:absolute;inset:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:8px}
  .overlay h2{margin:0;font-size:22px}
  .overlay p{margin:0;font-size:13px;color:var(--muted);max-width:380px;line-height:1.5}
  .overlay a{color:var(--ink);font-weight:700}
  .overlay button{text-align:center}
  .overlay .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .hidden{display:none!important}

  /* ── screens: title → create → town → battle ── */
  #cg[data-screen="title"] > :not(.title){display:none}
  #cg:not([data-screen="title"]) .title{display:none}
  .title{position:relative;overflow:hidden;border-radius:12px;border:2px solid var(--line);padding:34px 16px 22px;text-align:center;
    background:linear-gradient(var(--sky) 0 58%,var(--ground) 58%)}
  .logo{display:flex;flex-direction:column;align-items:center;line-height:.92;font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--fight);
    text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
  .logo span:first-child{font-size:clamp(22px,6vw,34px)}
  .logo span:last-child{font-size:clamp(28px,7.8vw,48px);color:var(--panel)}
  .tag{margin:12px 0 0;font-size:13px;font-weight:700;color:var(--ink)}
  .lineup{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:18px 0 6px}
  .lineup img{width:clamp(40px,11vw,60px);image-rendering:pixelated;image-rendering:crisp-edges;animation:bob 1.2s steps(2) infinite}
  .lineup img:nth-child(even){animation-delay:.6s}
  .lineup img.flip{transform:scaleX(-1)}
  .lineup .vs{font:900 14px ui-monospace,Menlo,Consolas,monospace;color:var(--ink);margin:0 6px 14px}
  .start{margin-top:14px;padding:12px 26px;font-size:16px;letter-spacing:.06em;text-align:center;animation:blink 1.1s steps(2) infinite}
  .start:hover,.start:focus-visible{animation:none}
  @keyframes blink{50%{opacity:.55}}
  .tiny{margin:12px 0 0;font-size:11px;color:var(--muted)}
  #cg[data-screen="create"] .bar, #cg[data-screen="create"] .wrap, #cg[data-screen="create"] .panel{display:none}
  #cg:not([data-screen="create"]) .creator{display:none}
  #cg:not([data-screen="town"]) .town{display:none}
  #cg[data-screen="town"] #turn, #cg[data-screen="town"] #phase, #cg[data-screen="town"] .toggle{visibility:hidden}
  #cg[data-screen="town"] .menu, #cg[data-screen="town"] .btns, #cg[data-screen="town"] .log{display:none}

  /* ── character creator ── */
  .creator{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .cr-top{display:flex;gap:14px;align-items:center}
  #crPrev{width:112px;height:112px;flex:none;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--t1);border:2px solid var(--line);border-radius:10px}
  .cr-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .cr-name label, .cr-row h3{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0}
  .cr-name input{font:inherit;font-size:16px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .cr-name button{align-self:flex-start}
  .cr-row{margin-top:12px}
  .cr-row h3{margin-bottom:6px}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--line)}
  .sw.on{outline:3px solid var(--ink);outline-offset:1px}
  .chip{padding:6px 11px;font-size:12px;border-radius:99px;text-align:center}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .cr-go{margin-top:16px;width:100%;padding:12px;font-size:15px;text-align:center}

  /* ── town (Canggu): a pixel-art canvas with a scrolling camera ── */
  #cg[data-screen="town"] .wrap{height:calc(var(--cell)*8)}   /* square view while exploring */
  .town{position:absolute;inset:0;z-index:3;overflow:hidden;background:#78b350}
  #townCv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
  /* cutscenes */
  .wrap.shake{animation:quake .4s}
  .lbox{position:absolute;left:0;right:0;height:0;background:#000;z-index:6;transition:height .45s ease;pointer-events:none}
  .lbox.top{top:0} .lbox.bot{bottom:0}
  .wrap.cine .lbox{height:11%}
  .wrap.cine .cutbox{bottom:calc(11% + 6px)}
  .flash{position:absolute;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none}
  .flash.go{animation:flashA .35s ease-out}
  @keyframes flashA{0%{opacity:.85}100%{opacity:0}}
  .vs{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;gap:4%;background:rgba(20,10,8,.72);pointer-events:none}
  .vs img{width:30%;image-rendering:pixelated;image-rendering:crisp-edges}
  .vs img.l{animation:vsL .45s cubic-bezier(.2,1.4,.4,1) both}
  .vs img.r{transform:scaleX(-1);animation:vsR .45s cubic-bezier(.2,1.4,.4,1) both}
  .vs span{font:900 clamp(32px,9vw,60px)/1 ui-monospace,Menlo,Consolas,monospace;color:#f2c14e;text-shadow:3px 3px 0 #3b2417,-2px -2px 0 #3b2417,2px -2px 0 #3b2417,-2px 2px 0 #3b2417;animation:vsPop .5s ease-out .35s both}
  @keyframes vsL{from{translate:-170% 0}to{translate:0 0}}
  @keyframes vsR{from{translate:170% 0}to{translate:0 0}}
  @keyframes vsPop{0%{transform:scale(3);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1);opacity:1}}
  .fade{position:absolute;inset:0;z-index:9;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
  .fade.on{opacity:1;pointer-events:auto}
  .cutbox{position:absolute;left:6px;right:6px;bottom:6px;z-index:6;display:flex;gap:10px;align-items:flex-start;padding:8px 26px 8px 8px;border:3px double #3b2a20;border-radius:8px;background:#fffaf3;color:#3b2a20;font-size:13px;line-height:1.4;cursor:pointer;user-select:none}
  .cutbox img{width:40px;height:40px;flex:none;image-rendering:pixelated;image-rendering:crisp-edges;background:#eadcc8;border-radius:6px}
  .cutbox b{display:block;font-size:12px;color:#a8391a}
  .cutbox .more{position:absolute;right:8px;bottom:5px;font-size:11px;animation:blink 1s steps(2) infinite}
  .banner{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none;font:900 clamp(40px,12vw,72px)/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--fight);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);animation:bannerPop 1s ease-out forwards}
  @keyframes bannerPop{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
  .tlabels{position:absolute;inset:0;pointer-events:none}
  .tlbl{position:absolute;translate:-50% -100%;font-size:10px;font-weight:800;line-height:1.4;padding:0 6px;border-radius:5px;white-space:nowrap;background:rgba(255,250,243,.92);color:#3b2a20;box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .tlbl.main{background:#e0782b;color:#fff}
  .hud{position:absolute;right:6px;top:6px;z-index:1;display:flex;gap:4px;pointer-events:none}
  .hud span{font-size:12px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(30,22,18,.72);color:#fff}
  .hud span.zero{opacity:.45}
  .talk{position:absolute;left:6px;right:6px;bottom:6px;z-index:4;padding:8px 26px 8px 10px;border:3px double #3b2a20;border-radius:8px;background:#fffaf3;color:#3b2a20;font-size:13px;line-height:1.4;cursor:pointer;user-select:none}
  .talk b{display:block;margin-bottom:2px;font-size:12px;color:#a8391a}
  .talk .more{position:absolute;right:8px;bottom:5px;font-size:11px;animation:blink 1s steps(2) infinite}
  button.mv.item{border-left-color:var(--heal)}
</style>
</head>
<body>
<div class="cg" id="cg" data-screen="title">
  <section class="title" id="title" aria-label="Super Start-up Adventure Time">
    <div class="logo"><span>Super Start-up</span><span>Adventure Time</span></div>
    <p class="tag">Digital nomads vs. the suits · Canggu, Bali</p>
    <div class="lineup" id="lineup" aria-hidden="true"></div>
    <button class="primary start" id="tStart">▶ Press start</button>
    <p class="tiny">A tiny tactics adventure · about 5 minutes · sound on 🔊</p>
  </section>
  <h1>🌴 Super Start-up Adventure Time</h1>
  <p class="sub">A beautiful morning in Canggu, Bali.</p>
  <section class="creator" id="creator" aria-label="Make your hero">
    <div class="cr-top">
      <canvas id="crPrev" width="24" height="24" role="img" aria-label="Your hero"></canvas>
      <div class="cr-name">
        <label for="crName">Your name</label>
        <input id="crName" maxlength="14" placeholder="Your name" autocomplete="off" spellcheck="false">
        <button id="crRand">🎲 Randomise</button>
      </div>
    </div>
    <div id="crRows"></div>
    <button class="primary cr-go" id="crGo">Head to Canggu →</button>
  </section>
  <div class="bar">
    <span id="turn">Turn 1</span>
    <span style="display:flex;gap:10px;align-items:center"><label class="toggle"><input type="checkbox" id="scenes" checked> Battle scenes</label><button class="snd" id="snd" title="Sound on/off">🔊</button></span>
    <span class="phase" id="phase">Your turn</span>
  </div>
  <div class="wrap">

  const SELFIE_LINES=["Hold still, you're ruining my lighting!", "Say 'synergy'!", "This is so going on my story.", "Wait, my good side is the other good side.",

  const INTERN_LINES=["It's giving… corporate.", "No cap, this co-working space is so 2019.", "I'm literally so cooked rn.", "This meeting could've been a TikTok.",

  const STARTS = [[1,2],[6,1],[7,2],[7,3],[6,4],[7,5],[3,0]];   // your hero, then FOES in order, then Gaz

  // ── BACKUP ── Matt joins at the start of turn 2. Each move is one of the services he delivers, and does what it says for the team.

      {name:"Automate the Admin",     kind:"magic", type:"stun", pow:0,  rng:[1,3], mp:4, color:"#8fd3ff", stun:70, area:1, icons:["⚙️","🤖","⚙️","✅"], sfx:"systems"},   // busywork on autopilot: the suits lose their turn
      {name:"Take It Off Your Plate", kind:"magic", type:"heal", pow:12, rng:[0,3], mp:3, color:"#74b383", cleanse:true},      // heals an ally, clears stun, gives back 3 MP
      {name:"Systems Setup",          kind:"magic", type:"buff", pow:3,  rng:[0,3], mp:4, color:"#e5b340"},                    // a back-office that runs itself: an ally gets +3 power and +1 move
      {name:"Summon Claude", kind:"magic", type:"summon", pow:0,  rng:[1,1], mp:5, color:"#e0782b"},

  const RALLY_HEAL = 8;

    moves:[

      {name:"Timber!",          kind:"fight", type:"dmg",  pow:14, rng:[1,1]},
      {name:"Maple Syrup Flood", kind:"magic", type:"stun", pow:0, rng:[1,3], mp:5, color:"#c26a1b", stun:60, area:1, icons:["🍁","🥞","🍁"], sfx:"maple"},
      {name:"Poutine Break",    kind:"magic", type:"heal", pow:12, rng:[0,2], mp:3, color:"#e5b340"},
    ]};

  // ── CHARACTER CREATOR ── options shown on the first screen. Add colours or styles freely.
  const LOOK = {
    skin:        {label:"Skin",        colors:["#f6d3b3","#f1c79b","#d9a274","#a0694a","#7a4a2e","#4f2f1d"]},
    hair:        {label:"Hair",        opts:["Short","Long","Bun","Curly","Buzz","Bald"]},
    hairColor:   {label:"Hair colour", colors:["#1b1b1f","#4a3222","#8a5a32","#e0b84f","#c2552d","#b7bec6","#d96fa8","#4f7fd1"]},
    facial:      {label:"Face",        opts:["Clean","Stubble","Beard","Moustache"]},
    outfit:      {label:"Outfit",      opts:["Hoodie","Tee","Tunic","Dress","Suit","Plaid","Aloha"]},
    outfitColor: {label:"Outfit colour", colors:["#f08a3c","#3d7fd1","#4fb05a","#e04a3c","#9a5ad6","#3a4a60","#f2c14e","#f7efe0"]},
    hat:         {label:"Hat",         opts:["None","Beanie","Cap","Crown","Flower"]},
    eyes:        {label:"Eyewear",     opts:["None","Glasses","Shades"]},
    eyeColor:    {label:"Eyewear colour", colors:["#141414","#d1352b","#e0782b","#3a6ea5","#d96fa8","#e5b340","#4f8a5b","#f4ede4"]},
  };
  // Default hero: Rikke — long brown hair, red dress, red sunglasses.
  const P = {name:"Rikke", skin:1, hair:1, hairColor:2, facial:0, outfit:3, outfitColor:3, hat:0, eyes:2, eyeColor:1};
  try { const saved = JSON.parse(localStorage.getItem("cg-hero") || "{}");
    for (const k in P) if (k in saved) {
      if (k === "name") P.name = String(saved.name).slice(0,14);
      else { const n = LOOK[k].colors ? LOOK[k].colors.length : LOOK[k].opts.length; if (Number.isInteger(saved[k]) && saved[k] >= 0 && saved[k] < n) P[k] = saved[k]; }
    } } catch(e) {}

  // ── CHARACTER ART ── 24×24 sprites in a 16-bit tactics-RPG style: chibi proportions, light from the
  // top-left, three-tone shading and coloured ("sel-out") outlines. Everyone — you, the townspeople,
  // Matt, Claude and the suits — is built from a "look" by makeSprite(look). Shapes are listed as
  // horizontal spans: [row, firstColumn, lastColumn].
  const SW=24;
  const mix=(hex,t,to)=>{ const a=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)), b=to==="w"?[255,248,232]:[22,12,26];
    return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,"0")).join(""); };
  // COZY FARM-SIM STYLE: warm juicy colours, one dark-brown outline round everything, soft shadows on the bottom-right only
  const OUTLINE="#3b2417";
  const ramp=hex=>({hi:mix(hex,.2,"w"), base:hex, sh:mix(hex,.22,"k"), ol:OUTLINE});

  function makeSprite(L){
    const M=Array.from({length:SW},()=>Array(SW).fill(null));   // which material each pixel is
    const span=(y,a,b,m)=>{ if(y<0||y>=SW) return; for(let x=Math.max(0,a);x<=Math.min(SW-1,b);x++) M[y][x]=m; };
    const dot=(x,y,m)=>{ if(x>=0&&y>=0&&x<SW&&y<SW) M[y][x]=m; };
    const outfit=LOOK.outfit.opts[L.outfit], hair=LOOK.hair.opts[L.hair], hat=LOOK.hat.opts[L.hat],
          face=LOOK.facial.opts[L.facial], eyes=LOOK.eyes.opts[L.eyes];
    // head, neck, body, sleeves, hands
    [[3,9,14],[4,7,16],[5,6,17],[6,6,17],[7,6,17],[8,6,17],[9,6,17],[10,7,16],[11,8,15],[12,10,13]].forEach(([y,a,b])=>span(y,a,b,"skin"));
    [[13,7,16],[14,6,17],[15,6,17],[16,6,17],[17,7,16]].forEach(([y,a,b])=>span(y,a,b,"top"));
    for(let y=13;y<=16;y++){ span(y,4,5,"top"); span(y,18,19,"top"); }
    span(17,4,5,"skin"); span(17,18,19,"skin");
    if(outfit==="Tee"||outfit==="Aloha") for(let y=15;y<=16;y++){ span(y,4,5,"skin"); span(y,18,19,"skin"); }
    if(outfit==="Dress"){ span(18,6,17,"top"); span(19,5,18,"top"); span(20,5,18,"top"); span(21,8,10,"shoe"); span(21,13,15,"shoe"); }
    else { span(18,8,15,"pants"); for(const y of [19,20]){ span(y,8,10,"pants"); span(y,13,15,"pants"); } span(21,7,10,"shoe"); span(21,13,16,"shoe"); }
    if(L.shorts) for(const y of [20]){ span(y,8,10,"skin"); span(y,13,15,"skin"); }   // shorts: bare legs below the knee
    // hair
    const crop=()=>{ span(2,8,15,"hair"); span(3,6,17,"hair"); span(4,5,18,"hair"); span(5,5,18,"hair");
      span(6,5,7,"hair"); span(6,16,18,"hair"); span(7,5,6,"hair"); span(7,17,18,"hair"); dot(9,6,"hair"); dot(12,6,"hair"); dot(14,6,"hair"); };
    if(hair==="Short"||hair==="Long"||hair==="Bun") crop();
    if(hair==="Long") for(let y=6;y<=15;y++){ span(y,4,6,"hair"); span(y,17,19,"hair"); }
    if(hair==="Bun"){ span(0,10,13,"hair"); span(1,9,14,"hair"); }
    if(hair==="Curly"){ span(1,7,16,"hair"); span(2,5,18,"hair"); for(let y=3;y<=6;y++) span(y,4,19,"hair"); for(let y=7;y<=9;y++){ span(y,4,6,"hair"); span(y,17,19,"hair"); } }
    if(hair==="Buzz"){ span(3,8,15,"hair"); span(4,6,17,"hair"); dot(6,5,"hair"); dot(17,5,"hair"); }
    if(face==="Beard"){ span(9,6,7,"hair"); span(9,16,17,"hair"); span(10,6,17,"hair"); span(11,7,16,"hair"); span(12,9,14,"hair"); }
    if(face==="Moustache") span(10,9,14,"hair");
    // hats
    if(hat==="Beanie"){ span(0,11,12,"hat"); span(1,8,15,"hat"); span(2,6,17,"hat"); span(3,5,18,"hat"); span(4,5,18,"cuff"); span(5,5,18,"cuff"); }
    if(hat==="Cap"){ span(1,8,15,"hat"); span(2,6,17,"hat"); span(3,5,18,"hat"); span(4,5,18,"hat"); span(5,2,9,"brim"); }
    if(hat==="Crown"){ dot(8,0,"gold"); dot(12,0,"gold"); dot(16,0,"gold"); span(1,8,16,"gold"); span(2,8,16,"gold"); }
    if(hat==="Flower"){ dot(16,2,"petal"); dot(15,3,"petal"); dot(17,3,"petal"); dot(16,4,"petal"); dot(16,3,"gold"); }

    // shading: light from the top-left, the right side of the figure in shade
    const topHex=L.topHex||LOOK.outfitColor.colors[L.outfitColor], hatHex=L.hatHex||(hat==="Cap"?"#3a6ea5":"#c23b30");
    const R={ skin:ramp(LOOK.skin.colors[L.skin]), hair:ramp(LOOK.hairColor.colors[L.hairColor]), top:ramp(topHex),
      pants:ramp(L.pantsHex||(outfit==="Suit"?topHex:"#3b4a63")), shoe:ramp("#5a3a2a"), hat:ramp(hatHex), cuff:ramp(mix(hatHex,.25,"k")),
      brim:ramp(mix(hatHex,.18,"k")), gold:ramp("#e5b340"), petal:ramp("#f2a6c4") };
    const C=Array.from({length:SW},()=>Array(SW).fill(null));
    const other=(x,y,m)=>x<0||y<0||x>=SW||y>=SW||M[y][x]!==m;
    for(let y=0;y<SW;y++) for(let x=0;x<SW;x++){
      const m=M[y][x]; if(!m) continue; const r=R[m]; let t=r.base;
      if(x>=16) t=r.sh;   // a soft shade down the right-hand side
      if(m==="hair" && (other(x,y-1,m)||other(x-1,y,m))) t=r.hi;   // only hair catches the light
      if(other(x+1,y,m)||other(x,y+1,m)) t=r.sh;
      if(m==="skin" && y>0 && ["hair","hat","cuff","brim"].includes(M[y-1][x])) t=r.sh;   // hair and hats cast a shadow
      if(m==="hair" && t===r.base && (x*3+y)%7===0) t=r.sh;                                 // strands
      if(m==="hair" && hair==="Curly" && (x+y)%3===0 && t!==r.sh) t=r.hi;                    // curls
      C[y][x]=t;
    }
    const put=(x,y,col)=>{ if(x>=0&&y>=0&&x<SW&&y<SW) C[y][x]=col; };
    // eyes: small and dark (no mouth, in the classic style)
    const EYE="#2a1a1a";
    if(M[8][9]==="skin"){ put(9,8,EYE); put(9,9,EYE); }
    if(M[8][14]==="skin"){ put(14,8,EYE); put(14,9,EYE); }
    if(face==="Stubble") for(let y=10;y<=11;y++) for(let x=8;x<=15;x++) if(M[y][x]==="skin" && (x+y)%2===0) put(x,y,mix(R.skin.base,.32,"k"));
    // outfit details
    const accent=L.accentHex||"#c23b30";
    if(outfit==="Hoodie"){ for(const [x,y] of [[10,13],[10,14],[13,13],[13,14]]) put(x,y,"#f4ede4"); for(let x=9;x<=14;x++) put(x,16,R.top.sh); }
    if(outfit==="Tee"||outfit==="Dress"||outfit==="Aloha"){ put(11,13,R.skin.base); put(12,13,R.skin.sh); }
    if(outfit==="Tunic"){ for(let x=7;x<=16;x++) put(x,17,x<15?"#c9962a":"#9c7220"); put(11,17,"#f5d68a"); }
    if(outfit==="Suit"){ for(const [x,y] of [[10,13],[13,13],[10,14],[13,14]]) put(x,y,"#f4f1ea"); for(let y=13;y<=17;y++){ put(11,y,accent); put(12,y,mix(accent,.3,"k")); } put(11,13,mix(accent,.2,"w")); }
    if(outfit==="Plaid") for(let y=13;y<=20;y++) for(let x=4;x<=19;x++) if(M[y][x]==="top" && ((x>>1)+(y>>1))%2===0) put(x,y,mix(C[y][x],.55,"k"));
    if(outfit==="Aloha") for(let y=13;y<=17;y++) for(let x=4;x<=19;x++) if(M[y][x]==="top" && (x*3+y*5)%7===0) put(x,y,(x+y)%2?"#fff3b0":"#f7b6d2");   // hibiscus print
    // eyewear
    const ec=LOOK.eyeColor.colors[L.eyeColor||0];
    if(eyes==="Glasses"){ const F=ec;   // thin rims around each eye, joined by a bridge
      for(const x of [8,9,10,13,14,15]){ put(x,7,F); put(x,10,F); } for(const x of [8,10,13,15]){ put(x,8,F); put(x,9,F); }
      put(11,8,F); put(12,8,F); }
    if(eyes==="Shades"){ for(const y of [8,9]) for(const x of [8,9,10,13,14,15]) put(x,y,ec); put(8,8,mix(ec,.45,"w")); put(13,8,mix(ec,.45,"w")); put(11,8,"#2a1a1a"); put(12,8,"#2a1a1a"); }

    // coloured outline: each empty pixel touching the figure takes the darkest tone of what it touches
    const out=document.createElement("canvas"); out.width=SW; out.height=SW; const g=out.getContext("2d");
    for(let y=0;y<SW;y++) for(let x=0;x<SW;x++){
      let col=C[y][x];
      if(!col){ for(const [dx,dy] of [[0,1],[-1,0],[1,0],[0,-1]]){ const nx=x+dx, ny=y+dy; if(nx>=0&&ny>=0&&nx<SW&&ny<SW&&M[ny][nx]){ col=OUTLINE; break; } } }
      if(col){ g.fillStyle=col; g.fillRect(x,y,1,1); }
    }
    return out;
  }

  // the cast (built with the same generator as your hero)
  const CAST={
    matthew:{skin:3, hair:0, hairColor:0, facial:1, outfit:0, outfitColor:0, hat:0, eyes:0},
    claude: {skin:1, hair:0, hairColor:1, facial:2, outfit:5, outfitColor:0, hat:1, hatHex:"#e0782b", eyes:0},
    manager:{skin:1, hair:0, hairColor:1, facial:0, outfit:4, topHex:"#3d63a8", accentHex:"#c23b30", hat:0, eyes:0},
    ceo:    {skin:2, hair:4, hairColor:5, facial:0, outfit:4, topHex:"#2c2c3a", accentHex:"#e5b340", hat:0, eyes:2, eyeColor:0},
    consult:{skin:0, hair:0, hairColor:3, facial:0, outfit:4, topHex:"#7d8a98", accentHex:"#3a6ea5", hat:0, eyes:1, eyeColor:0},
    consultW:{skin:0, hair:1, hairColor:4, facial:0, outfit:4, topHex:"#7d8a98", accentHex:"#3a6ea5", hat:0, eyes:1, eyeColor:0},
    consultA:{skin:1, hair:2, hairColor:0, facial:0, outfit:4, topHex:"#2f4a7a", accentHex:"#d96fa8", hat:0, eyes:0},
    gord:   {skin:0, hair:5, hairColor:1, facial:2, outfit:6, topHex:"#2fa7a0", hat:0, eyes:1, eyeColor:0, shorts:true, pantsHex:"#c9a36a"},   // bald, beard, glasses, beach shirt + shorts

  };

  const $ = id => document.getElementById(id);
  const board=$("board"), fx=$("fx"), overlay=$("overlay"), info=$("info"), menu=$("menu"), logEl=$("log");
  const K = (x,y) => x+","+y;
  if(window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){ r=Math.max(0,Math.min(Array.isArray(r)?r[0]:(r||0),w/2,h/2));
      this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); };
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const speed = () => S.fast ? 25 : (S.speed || 1);   // enemy scenes run a bit quicker; a tap skips
  const GLOW = !matchMedia("(pointer: coarse)").matches;   // glow (shadowBlur) is slow to draw on phones, so skip it there
  const FX_RATE = 1.35;   // attack animations play this much faster than their listed durations
  const wait = ms => sleep(ms / speed());
  const md = (a,b) => Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
  const inR = (d,r) => d>=r[0] && d<=r[1];
  const rngTxt = r => r[0]===r[1] ? r[0] : r[0]+"–"+r[1];

  let S;
  function reset(){
    S = {
      units: [heroDef(), ...FOES, GAZ].map((d,i)=>({...d, id:i, maxHp:d.hp, maxMp:d.mp, x:STARTS[i][0], y:STARTS[i][1], alive:true, acted:false, stun:false})),
      phase:"player", turn:1, sel:null, mode:null, origin:null, move:null, kind:null,
      moveSet:new Map(), targets:new Map(), danger:new Set(), range:new Set(), hit:new Set(), busy:false, fast:false,
      backupIn:false, backupDmg:0, backupHeal:0, claudeIn:false, claudeDmg:0,
      inv:{...INV},   // snacks found in town (a retry gets them all back)
      blast:new Set(), boom:new Set(), aoeAt:null, disco:new Set()
    };
    drawArena();
    logEl.innerHTML=""; log("The suits have taken over The Sloppy Sloth. You're on your own.");
    info.innerHTML=`Tap <b>${S.units[0].name}</b> to begin.`;
    render();
  }

  const terrain = (x,y) => MAP[y][x];
  const blocked = (x,y) => terrain(x,y)!==".";
  const unitAt = (x,y) => S.units.find(u=>u.alive && u.x===x && u.y===y);
  const alive = team => S.units.filter(u=>u.alive && u.team===team);

  function reachable(u){
    const seen=new Map([[K(u.x,u.y),0]]), q=[[u.x,u.y,0]];
    while(q.length){
      const [x,y,d]=q.shift(); if(d===u.mov) continue;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx, ny=y+dy;
        if(nx<0||ny<0||nx>=COLS||ny>=ROWS||blocked(nx,ny)||seen.has(K(nx,ny))) continue;
        const o=unitAt(nx,ny); if(o && o.team!==u.team) continue;
        seen.set(K(nx,ny),d+1); q.push([nx,ny,d+1]);
      }
    }
    for(const k of [...seen.keys()]){ const [x,y]=k.split(",").map(Number); const o=unitAt(x,y); if(o && o!==u) seen.delete(k); }
    return seen;
  }

  function targetsFor(u, mv, pos=u){
    if(mv.type==="summon"){   // an empty floor tile in range (only once per battle)
      if(S.claudeIn) return [];
      const out=[];
      for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(inR(Math.abs(x-pos.x)+Math.abs(y-pos.y),mv.rng) && !blocked(x,y) && !unitAt(x,y)) out.push({x,y});
      return out;
    }
    if(mv.area){   // any square in range whose blast would catch at least one enemy
      const foes=alive(u.team==="hero"?"foe":"hero"), out=[];
      for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++)
        if(inR(Math.abs(x-pos.x)+Math.abs(y-pos.y),mv.rng) && foes.some(f=>Math.abs(f.x-x)+Math.abs(f.y-y)<=mv.area)) out.push({x,y});
      return out;
    }
    const pool = mv.type==="heal" ? alive(u.team).filter(a=>a.hp<a.maxHp || (mv.cleanse && a.stun)) : mv.type==="buff" ? alive(u.team) : alive(u.team==="hero"?"foe":"hero");
    return pool.filter(t => inR(md(pos,t), mv.rng));
  }
  function areaTiles(cx,cy,r){   // the "+" blast: target square plus everything within r steps
    const s=new Set();
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(Math.abs(x-cx)+Math.abs(y-cy)<=r) s.add(K(x,y));
    return s;
  }
  const canUse = (u,mv) => (mv.mp||0) <= u.mp;

  function log(msg){ const p=document.createElement("div"); p.textContent=msg; logEl.prepend(p); }

  function float(u, text, color){
    const f=document.createElement("div"); f.className="float"; f.textContent=text; f.style.color=color;
    f.style.left=(u.x/COLS*100)+"%"; f.style.top=(u.y/ROWS*100)+"%";
    fx.appendChild(f); setTimeout(()=>f.remove(),900);
  }

  function showInfo(u){
    info.innerHTML=`<img src="${SPRITE_URL[u.spr]}" style="width:32px;height:32px;image-rendering:pixelated;vertical-align:middle;margin-right:6px"><b>${u.name}</b> · HP ${u.hp}/${u.maxHp} · MP ${u.mp}/${u.maxMp}${u.boost?` · 🍺 +${u.boost} ATK`:""}${u.stun?" · 💤 stunned":""}
      <div class="stats">DEF ${u.def} · MOVE ${u.mov} · ${u.blurb}</div>
      ${u.team==="foe" ? `<div class="stats">${u.moves.map(m=>`${m.kind==="magic"?"✨":"⚔️"} ${m.name}`).join(" · ")}</div>` : ""}`;
  }

  function renderBoard(){
    board.innerHTML="";
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      const c=document.createElement("div"), t=terrain(x,y), k=K(x,y);
      c.className="tile"+((x+y)%2?" alt":"")+(t==="~"?" counter":"")+(t==="#"?" rack":"");
      if(S.disco.has(k)) c.classList.add("disco");
      if(S.mode==="move" && S.moveSet.has(k)) c.classList.add("move");
      if(S.danger.has(k)) c.classList.add("danger");
      if(S.range.has(k)) c.classList.add("range");
      const tg=S.targets.get(k), u=unitAt(x,y);
      if(tg==="heal") c.classList.add("healt");
      else if(tg==="atk" || (tg==="area" && u && u.team==="foe")) c.classList.add("target");
      if(S.blast.has(k)) c.classList.add("aoe");
      if(S.boom.has(k)) c.classList.add("boom");
      if(tg==="area") c.onpointerenter=e=>{   // mouse: hovering previews the blast, click casts. Touch: first tap previews.
        if(e.pointerType!=="mouse" || S.aoeAt===k) return;
        S.aoeAt=k; S.blast=areaTiles(x,y,S.move.area); renderBoard(); };
      if(u){
        const el=document.createElement("div");
        el.className="unit"+(u.team==="foe"?" foe":u.team==="neutral"?" neutral":"")+(u===S.sel?" sel":"")+(u.acted?" done":"")+(S.hit.has(u.id)?" hit":"");
        el.innerHTML=`<img class="spr" src="${SPRITE_URL[u.spr]}" alt="${u.name}"><span class="hp"><i style="width:${u.hp/u.maxHp*100}%"></i></span>${u.stun?'<span class="zz">z</span>':""}`;
        c.appendChild(el);
      }
      c.onclick=()=>onCell(x,y);
      board.appendChild(c);
    }
    $("turn").textContent="Turn "+S.turn;
    const ph=$("phase"); ph.textContent=S.phase==="enemy"?"Enemy turn":"Your turn"; ph.classList.toggle("enemy",S.phase==="enemy");
    $("end").disabled = S.phase!=="player" || S.busy;
  }
  let fitFrame = () => {};   // set at the bottom when the game is inside an iframe
  function render(){ renderBoard(); renderMenu(); fitFrame(); }

  function btn(html, cls, onclick, disabled){
    const b=document.createElement("button"); b.className=cls; b.innerHTML=html; b.disabled=!!disabled; b.onclick=e=>{ Sound.sfx(/Back|Undo/.test(html)?"back":"blip"); onclick(e); }; menu.appendChild(b); return b;
  }

  function renderMenu(){
    menu.innerHTML="";
    const u=S.sel; if(!u || S.busy || S.phase!=="player") return;
    if(S.mode==="menu"){
      // one list: fight moves (orange) and magic moves (purple) together
      let any=false;
      for(const m of u.moves){
        const tg=targetsFor(u,m), ok=canUse(u,m)&&tg.length; if(ok) any=true;
        const eff = (m.type==="heal" ? `HEAL ${m.pow}${m.cleanse?" · UN-STUN · +3 MP":""}` : m.type==="buff" ? `+${m.pow} POWER · +1 MOVE` : m.type==="stun" ? `STUN ${m.stun}%` : m.type==="summon" ? "ONCE" : `PWR ${m.pow}${m.stun?` · STUN ${m.stun}%`:""}${m.recoil?` · COSTS ${m.recoil} HP`:""}`) + (m.area ? " · AREA" : "");
        const why = !canUse(u,m) ? " · low MP" : !tg.length ? (m.type==="summon" && S.claudeIn ? " · already here" : " · out of range") : "";
        const b=btn(`<b>${m.type==="summon"?"🍁":m.area?"💥":m.kind==="magic"?"✨":"⚔️"} ${m.name}</b><small>${eff} · RNG ${rngTxt(m.rng)}${m.mp?` · ${m.mp} MP`:""}${why}</small>`,
          "mv "+m.kind, ()=>pickMove(m), !ok);
        b.onmouseenter=()=>{ S.range=rangeTiles(u,m); renderBoard(); };
        b.onmouseleave=()=>{ S.range=new Set(); renderBoard(); };
      }
      for(const [k,it] of Object.entries(ITEMS)) if(S.inv[k]>0)
        btn(`<b>${it.icon} ${it.name} ×${S.inv[k]}</b><small>ITEM · ${it.desc}</small>`, "mv item", ()=>useItem(u,k));
      btn("Wait","aux", ()=>{ log(`${u.name} holds position.`); finish(u); });
      btn("↩ Undo move","aux", ()=>{ [u.x,u.y]=S.origin; select(u); });
      if(!any){ const h=document.createElement("div"); h.className="hint"; h.textContent="Nothing in range from here. Wait, or undo and move closer."; menu.appendChild(h); }
    } else if(S.mode==="target"){
      const h=document.createElement("div"); h.className="hint";
      h.textContent = S.move.area ? `${S.move.name}: tap a square to aim (the purple + is the blast), tap it again to cast.` : `${S.move.name}: tap a highlighted target.`;
      menu.appendChild(h);
      btn("← Back","aux",()=>{S.mode="menu";S.targets=new Map();S.range=new Set();S.blast=new Set();S.aoeAt=null;render();});
    }
  }

  function rangeTiles(u,m){
    const s=new Set();
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(inR(Math.abs(x-u.x)+Math.abs(y-u.y),m.rng)) s.add(K(x,y));
    return s;
  }

  function clearSel(){ S.sel=null; S.mode=null; S.move=null; S.moveSet=new Map(); S.targets=new Map(); S.danger=new Set(); S.range=new Set(); S.blast=new Set(); S.aoeAt=null; }

  function select(u){ Sound.sfx("select"); clearSel(); S.sel=u; S.mode="move"; S.moveSet=reachable(u); showInfo(u); render(); }

  function pickMove(m){
    S.move=m; S.mode="target"; S.range=rangeTiles(S.sel,m); S.targets=new Map(); S.blast=new Set(); S.aoeAt=null;
    for(const t of targetsFor(S.sel,m)) S.targets.set(K(t.x,t.y), m.area?"area" : m.type==="heal"||m.type==="summon"||m.type==="buff"?"heal":"atk");
    render();
  }

  function onCell(x,y){
    if(S.phase!=="player"||S.busy) return;
    const u=unitAt(x,y), k=K(x,y);
    if(S.mode==="target"){
      if(!S.targets.has(k)) return;
      if(S.move.area && S.aoeAt!==k){ S.aoeAt=k; S.blast=areaTiles(x,y,S.move.area); Sound.sfx("blip"); render(); return; }   // first tap: aim
      doMove(S.sel,u,S.move,x,y); return;
    }
    if(S.mode==="menu"||S.mode==="moves") return;
    if(S.mode==="move" && S.moveSet.has(k) && (!u||u===S.sel)){
      S.origin=[S.sel.x,S.sel.y]; S.sel.x=x; S.sel.y=y; S.mode="menu"; S.moveSet=new Map(); showInfo(S.sel); render(); return;
    }
    if(u && u.team==="hero" && !u.acted){ select(u); return; }
    if(u){ clearSel(); if(u.team==="foe") S.danger=new Set(reachable(u).keys()); showInfo(u); render(); return; }
    clearSel(); render();
  }

  // ── combat resolution ──
  function resolve(a,t,m){
    const r={};
    a.mp -= (m.mp||0);
    if(m.type==="heal"){ r.heal=Math.min(m.pow, t.maxHp-t.hp); t.hp+=r.heal; if(m.cleanse){ if(t.stun){ t.stun=false; r.cleansed=true; } t.mp=Math.min(t.maxMp,t.mp+3); } return r; }
    if(m.type==="buff"){ t.boost=(t.boost||0)+m.pow; t.mov+=1; r.buff=m.pow; return r; }
    if(m.recoil){ r.recoil=Math.min(m.recoil, a.hp-1); a.hp-=r.recoil; }   // hustle hurts you too (never knocks you out)
    if(m.pow){
      let dmg = m.kind==="magic" ? m.pow + Math.floor(Math.random()*3) - 1 : Math.max(1, m.pow + (a.boost||0) - t.def + Math.floor(Math.random()*3));
      if(m.kind==="fight" && Math.random()<0.1){ r.crit=true; dmg=Math.round(dmg*1.5); }
      r.dmg=dmg; t.hp=Math.max(0,t.hp-dmg);
    }
    if(t.hp===0){ t.alive=false; r.ko=true; }
    else if(m.stun){ r.stunned = Math.random()*100 < m.stun; if(r.stunned) t.stun=true; else r.resisted=true; }
    return r;
  }

  // ── MUSIC & SOUND ── original chiptunes, synthesised live (no audio files).
  // Songs: one token per 8th note. "D5" = note, "-" = hold previous, "." = rest.
  // Drums: k = kick, s = snare, h = hi-hat, . = nothing.
  const SONGS = {
    battle: { bpm:160, loop:true,
      lead:`A4 C5 E5 A5 G5 E5 C5 E5  F5 - E5 D5 E5 - C5 -  A4 C5 E5 A5 B5 A5 G5 E5  G#5 - - E5 B4 - E5 -
            A5 - G5 - F5 - E5 D5  C5 D5 E5 - A4 - C5 -  D5 E5 F5 - E5 D5 C5 B4  A4 - E4 - A4 - . .`,
      bass:`A2 A2 A3 A2 A2 A2 A3 A2  F2 F2 F3 F2 F2 F2 F3 F2  A2 A2 A3 A2 A2 A2 A3 A2  E2 E2 E3 E2 E2 E2 E3 E2
            F2 F2 F3 F2 F2 F2 F3 F2  C3 C3 C4 C3 C3 C3 C4 C3  D3 D3 D4 D3 E2 E2 E3 E2  A2 A2 A3 A2 A2 A2 A3 A2`,
      drums:"k.s.kks.".repeat(7)+"k.s.s.ss", hats:true },
    morning: { bpm:88, loop:true, wave:"triangle", leadVol:0.12,   // the wake-up scene: soft, bell-like, pentatonic
      lead:`D5 - A5 - G5 - E5 -  D5 - E5 G5 A5 - - -  C6 - A5 - G5 - E5 -  G5 - - - . . . .
            D5 - A5 - G5 - E5 -  D5 - E5 G5 A5 - C6 -  D6 - C6 A5 G5 - E5 -  D5 - - - . . . .`,
      bass:`D3 . . . A2 . . .  G2 . . . D3 . . .  C3 . . . G2 . . .  A2 . . . D3 . . .
            D3 . . . A2 . . .  G2 . . . D3 . . .  C3 . . . G2 . . .  A2 . . . D3 . . .`,
      drums:"", hats:false },
    cafe: { bpm:112, loop:true,
      lead:`D5 - F#5 A5 B5 A5 F#5 D5  E5 - F#5 G5 F#5 E5 D5 -  B4 - D5 F#5 G5 F#5 E5 D5  C#5 D5 E5 - A4 - . .
            D5 - F#5 A5 D6 - C#6 B5  A5 - G5 F#5 G5 A5 B5 -  G5 F#5 E5 D5 E5 F#5 E5 C#5  D5 - - - . . A4 .`,
      bass:`D3 . A2 . D3 . A2 .  A2 . E3 . A2 . E3 .  B2 . F#2 . B2 . F#2 .  A2 . E2 . A2 . C#3 .
            D3 . A2 . D3 . A2 .  G2 . D3 . G2 . D3 .  E2 . B2 . A2 . C#3 .  D3 . A2 . D3 . . .`,
      drums:"k...s...".repeat(8), hats:false },
    victory: { bpm:150, loop:false,
      lead:`G4 C5 E5 G5 - E5 G5 -  C6 - - - B5 C6 D6 -  E6 - - - - - . .`,
      bass:`C3 . G2 . C3 . G2 .  F2 . F2 . G2 . G2 .  C3 - - - - - . .`,
      drums:"k.s.k.s.k.s.k.ssk.......", hats:false, next:"cafe" },
    defeat: { bpm:90, loop:false,
      lead:`E5 - D5 - C5 - B4 -  A4 - G#4 - A4 - - -  . . . .`,
      bass:`A2 - - - F2 - - -  E2 - - - A2 - - -  . . . .`,
      drums:"", hats:false },
  };

  const Sound = (() => {
    let ctx=null, master, music, fx, noiseBuf, song=null, events=null, step=0, nextT=0, timer=null;
    let songName=null, hostPaused=false, announced=false;   // the page can pause us when the café's music starts
    let on = true; try { on = localStorage.getItem("cg-sound") !== "off"; } catch(e){}
    const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
    const freq = n => { const m=n.match(/^([A-G])(#|b)?(\d)$/); if(!m) return 0;
      const midi=12*(+m[3]+1)+NOTE[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0); return 440*Math.pow(2,(midi-69)/12); };
    function parse(str){ const toks=str.trim().split(/\s+/), out=toks.map(()=>null);
      toks.forEach((tk,i)=>{ if(tk==="-"||tk===".") return; let len=1; while(toks[i+len]==="-") len++; out[i]={f:freq(tk),len}; }); return out; }
    function init(){
      if(ctx) { if(ctx.state==="suspended") ctx.resume(); return; }
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=on?0.5:0; master.connect(ctx.destination);
      music=ctx.createGain(); music.gain.value=0.45; music.connect(master);
      fx=ctx.createGain(); fx.gain.value=0.8; fx.connect(master);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    function tone(type,f,t,dur,vol,dest,slideTo){
      if(!ctx||!f) return; const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(f,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008);
      g.gain.setValueAtTime(vol,t+Math.max(0.01,dur*0.7)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.02);
    }
    function noise(t,dur,vol,dest,type="highpass",f=1000,fTo){
      if(!ctx) return; const s=ctx.createBufferSource(), b=ctx.createBiquadFilter(), g=ctx.createGain();
      s.buffer=noiseBuf; b.type=type; b.frequency.setValueAtTime(f,t); if(fTo) b.frequency.exponentialRampToValueAtTime(fTo,t+dur);
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      s.connect(b); b.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+0.02);
    }
    function tick(){
      if(!song) return; const sd=60/song.bpm/2;
      while(nextT < ctx.currentTime+0.15){
        const L=events.lead[step], B=events.bass[step], D=song.drums[step % (song.drums.length||1)];
        if(L) { const lw=song.wave||"square", lv=song.leadVol||0.07; tone(lw,L.f,nextT,L.len*sd*0.92,lv,music); tone(lw,L.f*1.004,nextT+0.012,L.len*sd*0.8,lv*.35,music); }
        if(B) tone("triangle",B.f,nextT,B.len*sd*0.85,0.22,music);
        if(D==="k") tone("sine",150,nextT,0.13,0.5,music,40);
        if(D==="s") noise(nextT,0.09,0.18,music,"highpass",1800);
        if(song.hats && step%2===1) noise(nextT,0.03,0.05,music,"highpass",7000);
        nextT+=sd; step++;
        if(step>=events.len){
          if(song.loop) step=0;
          else { const nx=song.next; song=null; clearInterval(timer); timer=null;
                 if(nx) setTimeout(()=>play(nx), Math.max(0,(nextT-ctx.currentTime)*1000)+200); return; }
        }
      }
    }
    function play(name){
      songName=name; if(hostPaused) return;
      init(); if(!ctx) return; stop(); song=SONGS[name]; if(!song) return; announce();
      events={lead:parse(song.lead), bass:parse(song.bass)}; events.len=Math.max(events.lead.length,events.bass.length);
      step=0; nextT=ctx.currentTime+0.06; timer=setInterval(tick,25); tick();
    }
    function stop(){ song=null; if(timer) clearInterval(timer); timer=null; }

    // sound effects — keyed by the same names as the visual effects
    const SFX = {
      blip:  t=>tone("square",880,t,0.05,0.08,fx),
      select:t=>{ tone("square",660,t,0.05,0.08,fx); tone("square",990,t+0.05,0.06,0.08,fx); },
      back:  t=>tone("square",440,t,0.06,0.07,fx,330),
      hit:   t=>{ noise(t,0.12,0.5,fx,"lowpass",2500,300); tone("square",180,t,0.1,0.15,fx,60); },
      ko:    t=>{ [523,392,294,196].forEach((f,i)=>tone("square",f,t+i*0.09,0.1,0.12,fx)); },
      slash: t=>[0,0.1,0.2].forEach(d=>noise(t+d,0.12,0.4,fx,"bandpass",800,5000)),
      bash:  t=>{ tone("sine",120,t,0.25,0.7,fx,35); noise(t,0.2,0.5,fx,"lowpass",1200,200); },

    function announce(retry=true){
      if(!ctx||!on||announced||hostPaused) return;

    }
    function hostPause(){ hostPaused=true; announced=false; stop(); try { if(ctx && ctx.state==="running") ctx.suspend(); } catch(e){} }
    function hostResume(){ if(!hostPaused) return; hostPaused=false; try { if(ctx && ctx.state==="suspended") ctx.resume(); } catch(e){} if(songName && on) play(songName); }
    function sfx(name){ if(!ctx||!on||hostPaused) return; announce(); const f=SFX[name]; if(f) f(ctx.currentTime+0.01); }
    function setOn(v){ on=v; try{ localStorage.setItem("cg-sound", v?"on":"off"); }catch(e){}
      if(ctx) master.gain.setTargetAtTime(v?0.5:0, ctx.currentTime, 0.05); }
    return { init, play, stop, sfx, setOn, hostPause, hostResume, get on(){ return on; } };

        c.globalAlpha=1; if(v<.75) bigText(c,"TIMBER!",T.x,T.y-W*.16,W*.055,"#e0782b"); } }}),
    poutine:(A,T,W,H)=>{ const h=FX.heal(A,T,W,H); return {dur:1300, draw(c,t){   // a steaming bowl of poutine
      const bx=T.x, by=T.y-W*.12, br=W*.065; c.globalAlpha=Math.min(1,t*4);
      for(let i=0;i<9;i++){ c.fillStyle=i%2?"#f2c14e":"#e8b84a"; c.save(); c.translate(bx+(i-4)*br*.2,by-br*.15); c.rotate((i-4)*.15); c.fillRect(-2,-br*.6,4,br*.6); c.restore(); }   // fries
      c.fillStyle="#7a4a26"; c.beginPath(); c.ellipse(bx,by-br*.1,br*.8,br*.25,0,0,7); c.fill();                                                     // gravy
      c.fillStyle="#fff8e8"; for(const [dx,dy] of [[-.4,-.15],[.2,-.2],[.45,-.05],[-.1,-.05]]){ c.beginPath(); c.arc(bx+dx*br,by+dy*br,br*.1,0,7); c.fill(); }   // cheese curds

  function thrown(drawObj, burst, arc, spin){
    return (A,T,W,H)=>({dur:700, draw(c,t){
      const u=clamp(t/.65);
      if(u<1){ const p=arcPos(A,T,u,H*arc); c.save(); c.translate(p.x,p.y); c.rotate(t*spin); drawObj(c,W*.045); c.restore(); }
      else sparks(c,T,(t-.65)/.35,8,W*.09,burst); }});

  function playFx(name, fromEl, toEl){
    return new Promise(res0=>{
      let done=false; const res=()=>{ if(!done){ done=true; res0(); } };
      const make=FX[name]; if(!make) return res();
      try { Sound.sfx(name); } catch(e){ console.warn("sfx skipped:", name, e); }
      const bt=$("battle"), cv=$("fxc"), br=bt.getBoundingClientRect(), dpr=Math.min(2, window.devicePixelRatio||1);   // 3x canvases are costly on phones
      const W=br.width, H=br.height; cv.width=W*dpr; cv.height=H*dpr;
      const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
      const ctr=el=>{ const r=el.getBoundingClientRect(); return {x:r.left-br.left+r.width/2, y:r.top-br.top+r.height*.55}; };
      let A,T,fx; try { A=ctr(fromEl); T=ctr(toEl); fx=make(A,T,W,H); } catch(err){ console.warn("fx skipped:", name, err); return res(); }
      setTimeout(res, fx.dur/(speed()*FX_RATE)*2.5 + 600);   // backstop: if a phone pauses animation frames, the turn still carries on
      if(fx.shake){ bt.classList.remove("quake"); void bt.offsetWidth; setTimeout(()=>bt.classList.add("quake"), fx.dur*.5/(speed()*FX_RATE)); }
      let t=0, last=performance.now();
      (function frame(now){
        t = Math.max(0, t + Math.max(0, now-last)/fx.dur*speed()*FX_RATE); last=Math.max(last,now);
        ctx.clearRect(0,0,W,H);
        if(done) return;
        if(t>=1){ return res(); }
        try { ctx.save(); fx.draw(ctx,t); }
        catch(err){ console.warn("fx skipped:", name, err); ctx.restore(); ctx.clearRect(0,0,W,H); return res(); }
        ctx.restore();
        requestAnimationFrame(frame);
      })(last);
    });
  }

  function boxHTML(u, hp){

    return `<div class="nm">${u.name}</div>
      <div class="row">HP<div class="bar2 hpb${pct<30?" low":""}"><i style="width:${pct}%"></i></div></div>
      <div class="row">MP<div class="bar2 mpb"><i style="width:${u.mp/u.maxMp*100}%"></i></div></div>
      <div class="num">${hp}/${u.maxHp}</div>`;

  async function battleScene(a,t,m){
    // hero side bottom-left, the other unit top-right (self-heals show only the caster)
    const self = a===t;
    const heroBottom = a.team==="hero" ? a : t;
    const other = self ? null : (heroBottom===a ? t : a);
    const pTop=$("pTop"), pBot=$("pBot"), bTop=$("bTop"), bBot=$("bBot"), bt=$("battle");
    pTop.className="plat top"+(self?" hidden":""); bTop.classList.toggle("hidden",self); pBot.className="plat bot"; bt.classList.remove("quake");
    pBot.querySelector("img").src=SPRITE_URL[heroBottom.spr];
    bBot.innerHTML=boxHTML(heroBottom, heroBottom.hp);
    if(other){ const ti=pTop.querySelector("img"); ti.src=SPRITE_URL[other.spr]; ti.className="flip"; bTop.innerHTML=boxHTML(other, other.hp); }
    if(S.phase!=="enemy") S.fast=false;   // one tap skips the rest of the enemy turn
    bt.classList.remove("hidden");
    const aPlat = a===heroBottom ? pBot : pTop, tPlat = t===heroBottom ? pBot : pTop;
    const aBox = a===heroBottom ? bBot : bTop, tBox = t===heroBottom ? bBot : bTop;

    S.speed = a.team==="foe" ? 1.6 : 1;
    await typeMsg(`${a.name} used ${m.name}!`, 120);
    if(m.quip) await dialogue(`${a.name}: “${m.quip}”`);
    const r = resolve(a,t,m);
    aBox.querySelector(".mpb i").style.width=(a.mp/a.maxMp*100)+"%";
    if(!self && m.kind==="fight"){ aPlat.classList.add(a===heroBottom?"lunge-up":"lunge-down"); await wait(100); }
    await playFx(MOVE_FX[m.name], aPlat, tPlat);
    if(r.dmg){ tPlat.classList.add("hurt"); Sound.sfx("hit"); }
    tBox.querySelector(".hpb i").style.width=(t.hp/t.maxHp*100)+"%";
    tBox.querySelector(".hpb").classList.toggle("low", t.hp/t.maxHp<.3);
    tBox.querySelector(".num").textContent=`${t.hp}/${t.maxHp}`;
    await wait(80);

    const lines=[];
    if(r.crit) lines.push("A critical hit!");
    if(r.dmg!=null) lines.push(`${t.name} took ${r.dmg} damage${m.kind==="magic"?" (magic ignores armour)":""}.`);
    if(r.heal!=null) lines.push(r.heal ? `${t.name} recovered ${r.heal} HP!` : `${t.name} is already at full HP.`);
    if(r.cleansed) lines.push(`${t.name} is back on their feet!`);
    if(r.buff) lines.push(`${t.name} gets +${r.buff} power and +1 move for the rest of the fight!`);
    if(r.recoil) lines.push(`${a.name} took ${r.recoil} damage too. Running on no sleep.`);
    if(r.stunned) lines.push(`${t.name} is stunned! 💤`);
    if(r.resisted) lines.push(`${t.name} shrugged off the stun.`);
    if(r.ko) lines.push(t.team==="foe" ? `${t.name} was defeated!` : `${t.name} is out of the fight!`);
    for(const l of lines){
      if(l.includes("defeated")||l.includes("out of the fight")){ tPlat.classList.add("faint"); Sound.sfx("ko"); }
      if(l.includes("stunned!")) Sound.sfx("stun");
      await typeMsg(l, 450);
    }
    bt.classList.add("hidden");
    if(S.phase!=="enemy") S.fast=false;
    return r;
  }

  async function perform(a,t,m){
    let r;
    if(m.quips){ m={...m, quip:m.quips[Math.floor(Math.random()*m.quips.length)]}; log(`${a.name}: “${m.quip}”`); }   // a comment with the attack (the Intern's selfie captions)
    if($("scenes").checked){ r = await battleScene(a,t,m); }
    else {
      r = resolve(a,t,m);
      Sound.sfx(r.heal!=null?"heal":r.ko?"ko":"hit"); S.hit.add(t.id); render(); await sleep(300); S.hit.clear();
    }
    if(r.dmg!=null) float(t,(r.crit?"CRIT ":"")+"-"+r.dmg,"var(--enemy)");
    if(r.heal) float(t,"+"+r.heal,"var(--heal)");
    if(r.buff) float(t,"+"+r.buff+" PWR","var(--fight)");
    if(r.recoil) setTimeout(()=>float(a,"-"+r.recoil,"var(--enemy)"),250);
    if(r.stunned) setTimeout(()=>float(t,"💤","var(--magic)"),200);
    if(a.backup){ S.backupDmg+=r.dmg||0; S.backupHeal+=r.heal||0; }
    if(a.summoned) S.claudeDmg+=r.dmg||0;
    log(`${a.name} used ${m.name}` + (r.dmg!=null?` → ${t.name} −${r.dmg}${r.crit?" (crit)":""}`:"") + (r.heal!=null?` → ${t.name} +${r.heal}`:"") + (r.stunned?` · ${t.name} stunned`:"") + (r.buff?` → ${t.name} +${r.buff} power`:"") + (r.recoil?` · ${a.name} −${r.recoil} (no sleep)`:"") + (r.ko?` · ${t.name} ${t.team==="foe"?"defeated":"down"}!`:""));
    render();
    return r;
  }

  async function doMove(u,t,m,x,y){
    S.busy=true; S.targets=new Map(); S.range=new Set(); render();
    if(m.type==="summon") await summonClaude(u,x,y,m);
    else if(m.area) await castArea(u,x,y,m);
    else await perform(u,t,m);
    S.busy=false; finish(u);
  }

  function finish(u){
    u.acted=true; clearSel(); render();
    if(checkEnd()) return;
    if(alive("hero").every(h=>h.acted)) enemyPhase();
    else info.innerHTML="Pick your next hero.";
  }

  function checkEnd(){
    if(!alive("foe").length){ gameOver(true); return true; }
    if(!alive("hero").length){ gameOver(false); return true; }
    return false;
  }

  function gameOver(win){
    S.phase="over"; clearSel(); render();
    info.innerHTML = win ? "<b>Victory.</b>" : "<b>Defeat.</b>";
    const cta = `<a href="/#sec-contact" target="_top">Let's talk →</a>`;
    const assist = S.backupIn ? ` Matt dealt ${S.backupDmg} damage${S.claudeIn?`, Claude ${S.claudeDmg}`:""}.` : "";
    const btns = `<div class="row2"><button class="primary" id="again">${win?"Play again":"Try again"}</button><button id="newHero">New hero</button></div>`;
    overlay.innerHTML = win
      ? `<h2>Sloth saved 🦥</h2><p>Won in ${S.turn} turn${S.turn>1?"s":""}. The Sloppy Sloth stays sloppy.${assist}</p><p>Running your own thing? You don't have to hold the line alone. ${cta}</p>${btns}`
      : `<h2>Acquired.</h2><p>The Sloppy Sloth is now a co-working space with a kombucha tap.</p><p>Some fights need a plan, not just backup. ${cta}</p>${btns}`;
    overlay.classList.remove("hidden");
    Sound.play(win?"victory":"defeat");
    $("again").onclick=()=>{ overlay.classList.add("hidden"); reset(); Sound.play("battle"); };
    $("newHero").onclick=()=>{ Sound.stop(); showCreator(); };
  }

  // ── items (snacks found in town) ── using one takes the hero's turn
  async function useItem(u,k){
    S.busy=true; S.inv[k]--; render();
    if(k==="coffee"){ u.mp+=5; u.maxMp=Math.max(u.maxMp,u.mp); u.mov+=1; float(u,"+5 MP","var(--magic)"); }
    if(k==="beer"){ u.boost=(u.boost||0)+3; float(u,"+3 ATK","var(--fight)"); }
    if(k==="tacos"){ const amt=Math.min(16,u.maxHp-u.hp); u.hp+=amt; float(u,"+"+amt,"var(--heal)"); }
    Sound.sfx("heal"); log(`${u.name} used ${ITEMS[k].name} ${ITEMS[k].icon}`);

  // ── area magic: hits every enemy inside the "+" ──
  async function castArea(a,cx,cy,m){
    a.mp-=m.mp||0; S.speed=1;
    const area=areaTiles(cx,cy,m.area), hit=alive(a.team==="hero"?"foe":"hero").filter(f=>area.has(K(f.x,f.y)));
    S.blast=new Set(); S.aoeAt=null; S.boom=area; render();
    Sound.sfx(m.sfx || (m.type==="stun" ? "fog" : "boom"));
    if(m.icons) for(const k of area){ const [x,y]=k.split(",").map(Number); float({x,y}, m.icons[Math.floor(Math.random()*m.icons.length)], "var(--ink)"); }   // what this move throws around
    await wait(450);
    const parts=[];
    for(const t of hit){
      const r=resolve(a,t,{...m, mp:0});
      S.hit.add(t.id);
      if(r.dmg!=null) float(t,"-"+r.dmg,"var(--enemy)");
      if(r.stunned) float(t,"💤","var(--magic)");
      if(r.ko) Sound.sfx("ko");
      if(a.backup) S.backupDmg+=r.dmg||0;
      if(a.summoned) S.claudeDmg+=r.dmg||0;
      parts.push(`${t.name}${r.dmg!=null?` −${r.dmg}`:""}${r.stunned?" 💤":r.resisted?" (shrugged it off)":""}${r.ko?" defeated!":""}`);
    }
    if(hit.length) Sound.sfx("hit");
    S.boom=new Set(); render();
    await wait(400); S.hit.clear();
    log(`${a.name} used ${m.name} → ${parts.join(", ")}`);
    render();
  }

  // ── the Intern: never attacks you. Wanders over to his own team, then either posts or dances ──
  async function internTurn(e){
    const suits=alive("foe").filter(f=>f!==e);
    const near=()=>suits.filter(s=>Math.abs(s.x-e.x)+Math.abs(s.y-e.y)<=1);
    if(near().length && Math.random()<.2){ await tiktokDance(e,near()); return; }   // now and then he just dances (and hurts his own team)
    const p=planEnemy(e);   // otherwise: walk up and take a selfie with a hero in the background
    if(p && (p.x!==e.x||p.y!==e.y)){ e.x=p.x; e.y=p.y; render(); await wait(250); }
    if(p && p.t) await perform(e,p.t,p.m);
    else await sayScene(e, INTERN_LINES[Math.floor(Math.random()*INTERN_LINES.length)]);
  }
  async function tiktokDance(e,near){

    const parts=[];
    for(const s of near){ const dmg=Math.min(s.hp-1, 3+Math.floor(Math.random()*3)); if(dmg>0){ s.hp-=dmg; S.hit.add(s.id); float(s,"-"+dmg,"var(--enemy)"); parts.push(`${s.name} −${dmg}`); } }
    S.disco=new Set(); render(); await wait(350); S.hit.clear();

    render();

  // ── backup arrives ──
  async function callBackup(){
    S.backupIn=true;
    const heroes=alive("hero");
    let spot=null, best=Infinity;   // free tile near the heroes, biased to the home (left) side
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      if(blocked(x,y) || unitAt(x,y)) continue;
      const s=Math.min(...heroes.map(h=>Math.abs(x-h.x)+Math.abs(y-h.y))) + x*2;
      if(s<best){ best=s; spot=[x,y]; }
    }
    if(!spot) return;
    const u={...BACKUP, id:S.units.length, maxHp:BACKUP.hp, maxMp:BACKUP.mp, x:spot[0], y:spot[1], alive:true, acted:false, stun:false};
    S.units.push(u); info.innerHTML="<b>Reinforcements incoming…</b>"; render();

    for(const h of heroes){ const amt=Math.min(RALLY_HEAL, h.maxHp-h.hp); h.hp+=amt; if(amt) healed.push([h,amt]); }

  // ── enemy AI ──
  function planEnemy(e){
    const reach=reachable(e), heroes=alive("hero");
    let order=e.moves.filter(m=>canUse(e,m));
    if(order.length>1 && Math.random()<0.55) order=[order[1],order[0]]; // sometimes prefers magic
    for(const m of order){
      let best=null;
      for(const [k,steps] of reach){
        const [x,y]=k.split(",").map(Number);
        for(const h of heroes) if(inR(Math.abs(x-h.x)+Math.abs(y-h.y),m.rng)){
          const score=h.hp*10+steps; if(!best||score<best.score) best={x,y,t:h,m,score};
        }
      }
      if(best) return best;
    }
    let best=null;
    for(const [k,steps] of reach){
      const [x,y]=k.split(",").map(Number);
      const d=Math.min(...heroes.map(h=>Math.abs(x-h.x)+Math.abs(y-h.y)));
      const score=d*10+steps; if(!best||score<best.score) best={x,y,t:null,score};
    }
    return best;
  }

  async function enemyPhase(){
    try { await enemyPhaseRun(); }
    catch(err){   // something went wrong mid-turn: log it and hand control back instead of freezing
      console.warn("enemy turn recovered:", err);
      $("battle").classList.add("hidden"); $("pBot").classList.remove("hidden"); $("bBot").classList.remove("hidden");
      S.fast=false; S.busy=false; S.phase="player"; S.turn++;
      for(const h of alive("hero")){ h.acted=false; }
      info.innerHTML="Your turn. Pick a hero."; render();
    }
  }
  async function enemyPhaseRun(){
    S.phase="enemy"; S.busy=true; clearSel(); render();
    info.innerHTML="<b>Enemy turn…</b>";
    for(const e of alive("foe")) e.mp=Math.min(e.maxMp,e.mp+1);
    await wait(300);
    for(const e of alive("foe")){
      if(!alive("hero").length) break;
      if(e.stun){ e.stun=false; log(`${e.name} is stunned and loses a turn.`); float(e,"💤","var(--magic)"); render(); await wait(500); continue; }
      if(e.intern){ await internTurn(e); await wait(120); continue; }
      const p=planEnemy(e);
      if(p && (p.x!==e.x||p.y!==e.y)){ e.x=p.x; e.y=p.y; render(); await wait(250); }
      if(p && p.t){ await perform(e,p.t,p.m); await wait(120); }
      if(checkEnd()){ S.busy=false; return; }
    }
    const gord=S.units.find(u=>u.team==="neutral" && u.alive);   // Gord gets a turn every round: a beer and a comment
    if(gord && alive("hero").length) await gordTurn(gord);
    S.turn++; S.phase="player"; S.fast=false;
    const stunned=[];
    for(const h of alive("hero")){
      h.mp=Math.min(h.maxMp,h.mp+1); h.acted=false;
      if(h.stun){ h.stun=false; h.acted=true; stunned.push(h.name); log(`${h.name} is stunned and loses a turn.`); }
    }
    if(!S.backupIn) await callBackup();   // Matt joins at the start of turn 2
    S.busy=false;
    info.innerHTML = stunned.length ? `${stunned.join(" & ")} ${stunned.length>1?"are":"is"} stunned this turn. Pick another hero.` : "Your turn. Pick a hero.";
    render();
    if(alive("hero").every(h=>h.acted)) enemyPhase();
  }
